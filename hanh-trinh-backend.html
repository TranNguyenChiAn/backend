  "@TransactionalEventListener(phase = AFTER_COMMIT): chỉ gửi sau khi commit. Đơn giản, nhưng nếu ứng dụng chết ngay sau commit thì message mất.",
  "Transactional outbox: ghi message vào bảng outbox trong cùng transaction với dữ liệu. Một tiến trình khác đọc outbox và publish, xong thì đánh dấu. Không mất, có thể trùng nên bên nhận idempotent.",
  "Cũng áp dụng cho xóa cache, gửi thông báo đẩy, gọi dịch vụ ngoài sau khi lưu."
 ],
 pitfalls:["Gửi thông báo trước commit.","Outbox không có cơ chế dọn bảng."],
 iv:[{q:"Có nên gửi RabbitMQ bên trong @Transactional không?",a:"Không nên. Nếu transaction rollback thì message đã đi rồi. Tối thiểu dùng @TransactionalEventListener AFTER_COMMIT; cần chắc chắn không mất thì dùng outbox pattern: ghi message vào bảng outbox cùng transaction, tiến trình khác publish sau."}],
 project:"Chuyển lớp xong mới cập nhật nhóm của phụ huynh; gửi thông báo xong mới cho phép thu hồi. Hai luồng này đều cần thứ tự sau commit.",
 rel:["propagation","delivery-idempotency","case-notification"],
 quiz:[{q:"Phương án nào đảm bảo không mất message khi app chết ngay sau commit?",o:["Gửi trong transaction","AFTER_COMMIT listener","Transactional outbox","Không gửi"],a:2,w:"Message đã nằm trong DB cùng dữ liệu."}]},

/* ================= OPS ================= */
{id:"environments", r:"ops", title:"Nhiều môi trường và cấu hình lệch", min:8,
 problem:"Một tính năng đi local → dev → tester → staging → production. Lỗi chỉ xảy ra ở một môi trường thường do cấu hình hoặc dữ liệu lệch, không phải do code.",
 flow:[{t:"Local",d:"tự test"},{t:"Dev",d:"tích hợp"},{t:"Tester",d:"QA"},{t:"Staging",d:"giống prod"},{t:"Production",d:"golive"}],
 points:[
  "Cùng một artifact (image) chạy ở mọi môi trường; chỉ cấu hình khác (12-factor). Cấu hình nằm ngoài code: biến môi trường, ConfigMap, Secret.",
  "Lệch môi trường (drift) hay gặp: thiếu cấu hình menu hay dữ liệu danh mục, khác phiên bản service, service trỏ nhầm DB, thiếu secret.",
  "Checklist golive: migration DB (Liquibase), cấu hình, dữ liệu danh mục, phân quyền, phiên bản các service phụ thuộc, kế hoạch quay lại.",
  "So sánh môi trường có hệ thống: liệt kê cấu hình và phiên bản của từng môi trường để thấy lệch ở đâu."
 ],
 pitfalls:["Sửa tay trên production mà không ghi lại.","Dùng chung DB giữa các môi trường."],
 iv:[{q:"Kể một lỗi chỉ xảy ra trên một môi trường.",a:"Kể theo: triệu chứng, cách khoanh vùng (so cấu hình, phiên bản, dữ liệu giữa các môi trường), nguyên nhân, cách sửa, và đã thêm gì để không lặp lại (checklist, script)."}],
 project:"Chị từng gặp: thiếu cấu hình menu quản lý, server lệch so với môi trường khác, service nối nhầm DB, service không start. Chọn một vụ để kể chi tiết.",
 rel:["k8s-basics","observability","case-school"],
 quiz:[{q:"Nguyên tắc 12-factor về cấu hình là gì?",o:["Cấu hình viết cứng trong code","Cùng artifact, cấu hình lấy từ môi trường","Mỗi môi trường build một bản khác","Lưu cấu hình trong DB chung"],a:1,w:"Tách cấu hình khỏi code."}]},

{id:"k8s-basics", r:"ops", title:"Kubernetes cho dev backend", min:9,
 problem:"Service không start, pod khởi động lại liên tục, traffic tới pod chưa sẵn sàng. Cần đủ hiểu Kubernetes để tự chẩn đoán.",
 flow:[{t:"Deployment",d:"số bản sao, image"},{t:"Pod",d:"container chạy app"},{t:"Probe",d:"readiness, liveness"},{t:"Service",d:"địa chỉ ổn định"},{t:"Ingress / Gateway",d:"vào từ ngoài"}],
 points:[
  "Deployment quản lý số pod và cập nhật dần (rolling update). Service cho một địa chỉ ổn định trỏ tới các pod.",
  "Readiness probe: pod chưa sẵn sàng thì không nhận traffic. Liveness probe: pod treo thì bị khởi động lại.",
  "CrashLoopBackOff: container khởi động rồi chết liên tục. Xem kubectl logs --previous, kubectl describe pod (sự kiện, OOMKilled, thiếu ConfigMap/Secret).",
  "Requests/limits CPU và bộ nhớ: vượt limit bộ nhớ thì bị kill (OOMKilled).",
  "Lệnh hay dùng: get pods, describe, logs -f, exec, rollout status, rollout undo."
 ],
 pitfalls:["Liveness gọi tới DB: DB chậm làm mọi pod bị khởi động lại dây chuyền.","Không có readiness: request rơi vào pod đang khởi động."],

{id:"resilience", r:"ops", title:"Timeout, retry, circuit breaker", min:8,
 problem:"Một dịch vụ ngoài chậm có thể kéo sập cả hệ thống nếu mọi thread đều ngồi chờ nó.",
 flow:[{t:"Gọi dịch vụ ngoài",d:""},{t:"Timeout",d:"không chờ mãi"},{t:"Retry",d:"giãn cách, giới hạn"},{t:"Circuit breaker",d:"lỗi nhiều thì ngắt"},{t:"Fallback",d:"phản hồi thay thế"}],
 points:[
  "Timeout là lớp quan trọng nhất: connect timeout và read timeout cho mọi lời gọi ra ngoài.",
  "Retry chỉ cho lỗi tạm thời và thao tác idempotent; có giãn cách và jitter để không dồn tải.",
  "Circuit breaker (Resilience4j): tỷ lệ lỗi cao thì ngắt, trả lỗi nhanh, sau một lúc thử lại.",
  "Bulkhead: tách pool riêng cho từng dịch vụ ngoài để một bên chậm không ăn hết thread.",
  "Fallback: dữ liệu cache, thông báo thân thiện, xếp hàng xử lý sau."
 ],
 pitfalls:["Retry thao tác ký hoặc thanh toán không idempotent.","Timeout của Feign bị comment."],
 iv:[{q:"Gọi SmartCA bị chậm, hệ thống em bị ảnh hưởng thế nào và em phòng thế nào?",a:"Không có timeout thì mỗi lời gọi giữ một thread và có thể cả connection DB nếu nằm trong transaction, chậm lâu là cạn pool. Em đặt timeout, gọi ngoài transaction, giới hạn số lời gọi đồng thời, và dùng circuit breaker để trả lỗi nhanh khi SmartCA đang có sự cố."}],
 project:"Bật lại timeout cho Feign trong service entity là một cải tiến cụ thể có thể đề xuất.",
 rel:["pools","consumer-failures","case-school"],
 quiz:[{q:"Lớp phòng vệ cơ bản nhất khi gọi dịch vụ ngoài?",o:["Circuit breaker","Timeout","Cache","Log"],a:1,w:"Không có timeout thì các lớp khác cũng vô dụng."}]},

{id:"design-framework", r:"design", title:"Khung trả lời một bài thiết kế", min:10,
 problem:"Bài thiết kế hệ thống không có đáp án duy nhất. Người phỏng vấn chấm cách suy nghĩ: hỏi rõ yêu cầu, ước lượng, chọn giải pháp và nói được đánh đổi.",
 flow:[{t:"Yêu cầu",d:"chức năng + phi chức năng"},{t:"Ước lượng",d:"người dùng, QPS, dữ liệu"},{t:"API + dữ liệu",d:""},{t:"Kiến trúc tổng",d:"sơ đồ khối"},{t:"Đào sâu",d:"điểm nghẽn, lỗi"},{t:"Đánh đổi",d:""}],
 points:[
  "Hỏi trước khi vẽ: ai dùng, làm được gì, bao nhiêu người, cần nhanh cỡ nào, mất dữ liệu có chấp nhận được không.",
  "Ước lượng thô: 4.700 người dùng, giờ cao điểm 20% online, mỗi người 1 request/10 giây → khoảng 100 request/giây.",
  "Thiết kế API và mô hình dữ liệu trước khi chọn công nghệ.",
  "Vẽ khối: client, gateway, các service, DB, cache, queue. Rồi đi theo một request qua sơ đồ.",
  "Đào sâu vào chỗ hỏng: một thành phần chết thì sao, tải gấp 10 thì sao, dữ liệu lệch thì sao.",
  "Câu nào cũng kết bằng đánh đổi: được gì, mất gì, vì sao chọn."
 ],
 pitfalls:["Vẽ ngay Kafka, microservices khi chưa hỏi quy mô.","Chỉ nói công nghệ, không nói lý do."],
 iv:[{q:"Thiết kế hệ thống gửi thông báo cho cả trường.",a:"Xem bài \"Thiết kế: thông báo và thu hồi\"."}],
 project:"Hệ thống trường học của chị là chất liệu tốt nhất cho mọi bài thiết kế: chị biết yêu cầu thật, quy mô thật và các chỗ từng hỏng.",
 rel:["case-notification","case-school","littles-law"],
 quiz:[{q:"Bước đầu tiên khi nhận đề thiết kế?",o:["Chọn database","Hỏi rõ yêu cầu và quy mô","Vẽ microservices","Viết code"],a:1,w:"Không có yêu cầu thì không có lựa chọn đúng."}]},

{id:"case-notification", r:"design", title:"Thiết kế: gửi và thu hồi thông báo", min:12,
 problem:"Gửi thông báo cho hàng nghìn phụ huynh, đẩy lên điện thoại, và cho phép thu hồi thông báo đã gửi, kể cả xóa thông báo đẩy đã hiện.",
 flow:[{t:"Tạo thông báo",d:"API"},{t:"Lưu + outbox",d:"cùng transaction"},{t:"Fan-out",d:"theo người nhận, qua queue"},{t:"Push",d:"FCM / APNs"},{t:"Thu hồi",d:"đánh dấu + push xóa"}],
 points:[
  "Tách \"tạo thông báo\" khỏi \"gửi tới từng người\": API chỉ lưu và trả về nhanh; việc gửi chạy nền qua queue.",
  "Lưu theo hai bảng: thông báo (nội dung) và người nhận (trạng thái gửi, đã đọc). Danh sách chưa đọc cần index (user_id, read).",
  "Gửi theo lô qua RabbitMQ, retry cho lỗi tạm thời, DLQ cho lỗi vĩnh viễn, idempotent theo (notification_id, user_id).",
  "Thu hồi: đánh dấu thông báo đã thu hồi (không xóa cứng để còn lịch sử), người nhận chưa đọc không thấy nữa, gửi push dạng im lặng để app xóa thông báo đã hiện.",
  "Với EAV, thu hồi phức tạp vì phải tìm và cập nhật mọi bản ghi người nhận liên quan; làm theo lô, có thể chạy lại.",
  "Nhắc hạn tự động (hợp đồng sắp hết, giáo viên đi làm lại): job định kỳ chọn đối tượng, tạo thông báo qua đúng luồng trên."
 ],
 pitfalls:["Gửi push đồng bộ trong request tạo thông báo: chậm và dễ timeout.","Thu hồi bằng xóa cứng: mất dấu vết."],
 iv:[{q:"Làm sao thu hồi một thông báo đã gửi?",a:"Đánh dấu thu hồi trên bản ghi thông báo, ẩn với người nhận; gửi push im lặng để ứng dụng xóa thông báo đã hiện trên Android và iOS; làm theo lô qua queue, idempotent để chạy lại được; giữ lịch sử thay vì xóa cứng."}],
 project:"Đây là luồng chị đã làm thật. Kể theo khung yêu cầu → thiết kế → chỗ khó (EAV, push đã hiện) → cách xử lý.",
 rel:["outbox","consumer-failures","eav"],
 quiz:[{q:"Vì sao không gửi push ngay trong request tạo thông báo?",o:["Push không cho phép","Chậm, dễ timeout và lỗi một người nhận làm hỏng cả request","Tốn RAM","Không có lý do"],a:1,w:"Tách ra chạy nền qua queue."}]},

{id:"case-school", r:"design", title:"Thiết kế: hệ thống quản lý trường", min:12,
 problem:"Tổng hợp mọi thứ: nhiều trường (tenant), nhiều vai trò, ký số, thu phí, LMS. Đây là bài chị có thể vẽ từ kinh nghiệm thật.",
 flow:[{t:"Web / App",d:""},{t:"Gateway",d:"JWT, tenant, định tuyến"},{t:"Services",d:"user, entity, event, ký số..."},{t:"PostgreSQL",d:"EAV"},{t:"Redis",d:"quyền, menu"},{t:"RabbitMQ",d:"sự kiện, H5P"}],
 points:[

  "Dữ liệu: EAV cho linh hoạt giữa các sản phẩm; nghiệp vụ nhiều thực thể gói trong transaction; tìm kiếm gộp truy vấn để tránh N+1.",
  "Ký số: gọi SmartCA ngoài transaction, có timeout, chặn ký trùng bằng UPDATE có điều kiện, ký nhiều file một giao dịch.",

  "Vận hành: ba môi trường trên Kubernetes, cấu hình tách khỏi code, checklist golive.",
  "Điểm có thể cải thiện: tenant chỉ lấy từ token, GET cho tìm kiếm đơn giản, outbox cho message quan trọng, bật timeout Feign, giám sát DLQ."
 ],

 iv:[{q:"Nếu được thiết kế lại hệ thống hiện tại, em đổi gì?",a:"Chọn hai ba điểm có lý do: tenant lấy hoàn toàn từ token; outbox cho các sự kiện quan trọng; GET cho tìm kiếm đơn giản; timeout và circuit breaker cho dịch vụ ngoài; cân nhắc jsonb thay EAV cho phần thuộc tính động."}],
 project:"Bài cuối của bản đồ. Tự vẽ sơ đồ hệ thống của chị ra giấy, rồi đi theo luồng ký số và luồng chuyển lớp từ đầu đến cuối.",

);

/* merge two progress snapshots: union of what was learned, max of counters */
function mergeProgress(a,b){
  const m={...a};
  m.done={...(b.done||{}),...(a.done||{})};
  m.labs={...(b.labs||{}),...(a.labs||{})};
  m.qa={...(b.qa||{}),...(a.qa||{})};
  m.cards={...(b.cards||{})}; Object.entries(a.cards||{}).forEach(([k,v])=>{ if(m.cards[k]!=='known') m.cards[k]=v; });
  m.xp=Math.max(a.xp||0,b.xp||0);
  const ex=[...(a.exams||[]),...(b.exams||[])], seen=new Set();
  m.exams=ex.filter(e=>{const k=[e.d,e.n,e.ok,e.pct].join('|'); if(seen.has(k)) return false; seen.add(k); return true;});
  const da=a.day||{}, db=b.day||{};
  m.day = da.d===db.d ? {d:da.d,xp:Math.max(da.xp||0,db.xp||0)} : ((da.d||'')>(db.d||'')?da:db);
  const sa=a.streak||{}, sb=b.streak||{};
  m.streak = (sa.last||'')===(sb.last||'') ? {last:sa.last,n:Math.max(sa.n||0,sb.n||0)} : ((sa.last||'')>(sb.last||'')?sa:sb);
  m.labTries={...(b.labTries||{})}; Object.entries(a.labTries||{}).forEach(([k,v])=>{ m.labTries[k]=[...new Set([...(m.labTries[k]||[]),...v])]; });
  return m;
}
let repoSync='chưa kiểm tra';
async function syncFromRepo(){
  if(!/^https?:/.test(location.protocol)){ repoSync='không áp dụng khi mở file trực tiếp'; return; }
  try{
    const r=await fetch('progress.json',{cache:'no-store'});
    if(!r.ok){ repoSync='repo chưa có progress.json'; return; }
    const remote=await r.json();
    const before=JSON.stringify(S);
    S=Object.assign(S,mergeProgress(S,remote)); 
    repoSync='đã gộp tiến độ từ progress.json'+(remote.updatedAt?' (lưu lúc '+new Date(remote.updatedAt).toLocaleString('vi-VN')+')':'');
    if(JSON.stringify(S)!==before){ save(); route(); }
  }catch(e){ repoSync='không đọc được progress.json'; }
}

function addXP(n,why){
  if(!n) return;
  S.xp+=n;
  if(S.day.d!==today()) S.day={d:today(),xp:0};
  S.day.xp+=n;
  const t=today();
  if(S.streak.last!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak.n = S.streak.last===y ? S.streak.n+1 : 1; S.streak.last=t;
  }
  save(); toast(`+${n} XP · ${why}`); renderRail();
}

let toastT; function toast(m){ document.querySelectorAll('.toast').forEach(e=>e.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2200); }

function labTry(id,key,need){ S.labTries[id]=S.labTries[id]||[]; if(!S.labTries[id].includes(key)) S.labTries[id].push(key); save(); if(S.labTries[id].length>=need) labDone(id); return S.labTries[id].length; }

let cleanup=null;
function route(){
  if(cleanup){ cleanup(); cleanup=null; }
  const r=curRoute(), v=$('#view');
  renderRail(); window.scrollTo(0,0);
  if(r==='home') return viewHome(v);
  if(r==='map'||r.startsWith('map-')) return viewMap(v, r.startsWith('map-')?r.slice(4):null);
  if(r.startsWith('lesson-') && LS[r.slice(7)]) return viewLesson(v, r.slice(7));
  if(r==='roadmap') return viewRoadmap(v);
  if(r==='labs') return viewLabs(v);
  if(r.startsWith('lab-') && LABS.find(l=>l.id===r)) return viewLab(v, r);
  if(r==='ref') return viewRef(v);
  if(r==='practice') return viewPractice(v);
  if(r==='cards') return viewCards(v);
  if(r==='exam') return viewExam(v);
  if(r==='backup') return viewBackup(v);
  viewHome(v);
}

function mix(q){ const idx=shuffle(q.o.map((_,i)=>i)); return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}; }
function renderQuizList(el,qs,onAnswer){
  qs=qs.map(mix);
  el.innerHTML = qs.map((q,i)=>`<div class="q" data-i="${i}"><p>${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="lt">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('');
  el.querySelectorAll('.q').forEach(qe=>{
    const q=qs[+qe.dataset.i];
    qe.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j, ok=j===q.a;
      qe.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(+x.dataset.j===q.a) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      qe.insertAdjacentHTML('beforeend',`<div class="why"><b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Đúng.':'Chưa đúng.'}</b> ${esc(q.w)}</div>`);
      const first = S.qa[q.id]===undefined;
      S.qa[q.id]=ok; save();
      if(ok && first) addXP(10,'trả lời đúng');
      if(onAnswer) onAnswer(ok);
    });
  });
}

  v.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>runExam(v,+b.dataset.n,+b.dataset.m));

function runExam(v,n,mins){
  // spread across regions
  const byR = REGIONS.map(r=>shuffle(QUIZ.filter(q=>q.r===r.id)));
  let qs=[]; while(qs.length<Math.min(n,QUIZ.length)){ byR.forEach(a=>{ if(a.length && qs.length<n) qs.push(mix(a.shift())); }); }
  const ans=new Array(qs.length).fill(null), flag=new Array(qs.length).fill(false);
  let cur=0, left=mins*60, done=false;
  const t=setInterval(()=>{ left--; const el=$('#tmr'); if(el) el.textContent=fmt(left); if(left<=0) finish(); },1000);
  cleanup=()=>clearInterval(t);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const draw=()=>{ const q=qs[cur];
    v.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px"><b>Câu ${cur+1}/${qs.length}</b><span class="timer" id="tmr">${fmt(left)}</span><button class="btn" type="button" id="esub">Nộp bài</button></div>
    <div class="lab-wrap" style="grid-template-columns:minmax(0,1fr) minmax(0,260px)">
     <div class="card"><div class="q"><span class="tag" style="margin-bottom:10px"><span class="dot" style="background:${RG[q.r].hue}"></span>${esc(RG[q.r].name)}</span><p style="margin-top:10px">${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt ${ans[cur]===j?'sel':''}" type="button" data-j="${j}"><span class="lt">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>
      <div style="display:flex;justify-content:space-between;gap:8px;padding:0 18px 16px"><button class="btn sm" type="button" id="eprev" ${cur?'':'disabled'}>← Trước</button><button class="btn sm" type="button" id="eflag">${flag[cur]?'Bỏ đánh dấu':'Đánh dấu xem lại'}</button><button class="btn sm" type="button" id="enext" ${cur<qs.length-1?'':'disabled'}>Sau →</button></div></div>
     <div class="card pad"><div class="h-sec" style="margin-top:0">Danh sách câu</div><div class="qgrid">${qs.map((_,k)=>`<button type="button" data-k="${k}" class="${ans[k]!==null?'ans':''} ${flag[k]?'flag':''} ${k===cur?'cur':''}">${k+1}</button>`).join('')}</div><p class="muted" style="font-size:12.5px;margin:12px 0 0">Đã trả lời ${ans.filter(a=>a!==null).length}/${qs.length}</p></div>
    </div>`;
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.j; if(cur<qs.length-1) cur++; draw();});
    v.querySelectorAll('.qgrid button').forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw();});
    $('#eprev').onclick=()=>{cur--;draw();}; $('#enext').onclick=()=>{cur++;draw();};
    $('#eflag').onclick=()=>{flag[cur]=!flag[cur];draw();};
    $('#esub').onclick=()=>{ const un=ans.filter(a=>a===null).length; if(un && !$('#esub').dataset.c){ $('#esub').dataset.c=1; $('#esub').textContent=`Còn ${un} câu trống · bấm lần nữa để nộp`; return;} finish(); };
  };
  const finish=()=>{ if(done) return; done=true; clearInterval(t);
    const ok=qs.filter((q,k)=>ans[k]===q.a).length, pct=Math.round(100*ok/qs.length);
    S.exams.push({d:today(),n:qs.length,ok,pct}); qs.forEach((q,k)=>{ if(ans[k]!==null) S.qa[q.id]=ans[k]===q.a; }); save();
    addXP(ok*5+(pct>=70?50:0), pct>=70?'đạt bài thi':'hoàn thành bài thi');
    const per=REGIONS.map(r=>{const a=qs.map((q,k)=>[q,k]).filter(([q])=>q.r===r.id); return {r,n:a.length,ok:a.filter(([q,k])=>ans[k]===q.a).length};}).filter(x=>x.n);
    v.innerHTML=`<div class="card pad" style="display:flex;flex-wrap:wrap;gap:20px;align-items:center"><div class="ring" style="--p:${pct};--c:${pct>=70?'var(--good)':'var(--bad)'};width:84px;height:84px" data-l="${pct}%"></div><div><h2 style="margin:0;font-size:24px">${pct>=70?'Đạt':'Chưa đạt'} · ${ok}/${qs.length} câu</h2><p class="muted" style="margin:4px 0 0">Ngưỡng đạt 70%. Xem lại câu sai bên dưới, mỗi câu có đường dẫn về bài học.</p></div><a class="btn" href="#exam" style="margin-left:auto">Về trang thi</a></div>
    <div class="h-sec">Theo chủ đề</div><div class="card pad caps">${per.map(x=>`<div class="cap ${x.ok/x.n<.7?'min':''}"><span>${esc(x.r.name)}</span><span class="track"><i style="width:${100*x.ok/x.n}%"></i></span><span class="val">${x.ok}/${x.n}</span></div>`).join('')}</div>
    <div class="h-sec">Xem lại câu sai</div><div class="card">${qs.map((q,k)=>[q,k]).filter(([q,k])=>ans[k]!==q.a).map(([q,k])=>`<div class="q"><p>${k+1}. ${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<div class="opt ${j===q.a?'right':''} ${j===ans[k]&&j!==q.a?'wrong':''}"><span class="lt">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}</div><div class="why">${esc(q.w)} <a href="#lesson-${q.les}">Ôn bài →</a></div></div>`).join('')||'<div class="empty">Không sai câu nào.</div>'}</div>`;
    window.scrollTo(0,0);
  };
  draw();
}

/* ---------- search ---------- */
function openSearch(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card box" role="dialog" aria-label="Tìm kiếm"><input class="search" id="gq" type="search" placeholder="Tìm bài học, thuật ngữ, lab…" aria-label="Tìm kiếm"><div class="sres" id="gr"></div></div>`;
  document.body.appendChild(m);
  const all=[...LESSONS.map(l=>({t:l.title,k:'Bài học · '+RG[l.r].name,h:'#lesson-'+l.id,s:l.title+' '+l.problem})),
   ...GLOSSARY.map(g=>({t:g[0],k:'Thuật ngữ',h:'#lesson-'+g[3],s:g[0]+' '+g[2]})),
   ...LABS.map(x=>({t:x.title,k:'Lab',h:'#'+x.id,s:x.title+' '+x.desc}))];
  let sel=0, res=[];
  const draw=q=>{ const n=q.toLowerCase().trim(); res=(n?all.filter(a=>a.s.toLowerCase().includes(n)):all.slice(0,8)).slice(0,12); sel=0;
    $('#gr').innerHTML=res.map((a,i)=>`<a href="${a.h}" class="${i===sel?'on':''}">${esc(a.t)}<small>${esc(a.k)}</small></a>`).join('')||'<div class="empty">Không tìm thấy.</div>'; };
  const close=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) close(); };
  $('#gr').onclick=e=>{ if(e.target.closest('a')) close(); };
  $('#gq').oninput=e=>draw(e.target.value);
  $('#gq').onkeydown=e=>{ if(e.key==='Escape') close(); if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+res.length)%res.length; $('#gr').querySelectorAll('a').forEach((a,i)=>a.classList.toggle('on',i===sel));}
    if(e.key==='Enter'&&res[sel]){ location.hash=res[sel].h; close(); } };
  draw(''); $('#gq').focus();
}
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(!document.querySelector('.modal')) openSearch(); } });

{id:"lab-tx", title:"Ống chung, ống riêng: transaction lồng nhau", r:"data", icon:"db", lv:3, min:8, les:["propagation","transactions"],
 desc:"a() @Transactional lưu x rồi gọi b() lưu y. Đổi cách gọi, propagation, chỗ ném lỗi và việc bắt lỗi, xem x và y còn hay mất.",

 run(el){

   <label>Propagation của b()${seg('prop',[['REQUIRED','REQUIRED'],['REQUIRES_NEW','REQUIRES_NEW'],['NESTED','NESTED']],'REQUIRED')}</label>
   <label>Lỗi xảy ra${seg('err',[['none','Không lỗi'],['B','b() ném lỗi sau khi lưu y'],['A','a() ném lỗi sau khi b() xong']],'none')}</label>
   <label class="row"><input type="checkbox" id="tc" checked> a() bắt lỗi của b() bằng try/catch rồi chạy tiếp</label>
   <pre class="log" style="max-height:none">@Transactional
public void a() {
    repo.save(x);
    <span id="tcode1">try { </span>serviceB.b();<span id="tcode2"> } catch (RuntimeException e) { log.warn(..) }</span>
    <span id="tcode3">// không lỗi</span>
}</pre><div id="tprog"></div></div>
   <div style="display:grid;gap:14px;min-width:0"><div class="tubes" id="ttubes"></div><div id="tres"></div></div></div>`;
  const calc=()=>{
   const self=call==='self';
   if(self){
     if(err==='none') return {x:1,y:1,ex:null,shared:true,note:"this.b() không qua proxy nên @Transactional của b() bị bỏ qua dù khai báo gì. b() chạy như code thường trong ống của a()."};
     if(err==='B') return caught? {x:1,y:1,ex:null,shared:true,note:"Không có proxy nào thấy lỗi của b(), nên không có dấu rollback-only. a() bắt lỗi, chạy tiếp và commit: y vẫn được lưu dù b() đã lỗi. Đây là lý do gọi nội bộ rất dễ gây dữ liệu sai."}

   }
   if(prop==='REQUIRED'){
     if(err==='none') return {x:1,y:1,ex:null,shared:true,note:"b() dùng chung ống của a(). Chỉ commit một lần khi a() kết thúc."};
     if(err==='B') return caught? {x:0,y:0,ex:"UnexpectedRollbackException",shared:true,note:"Proxy của b() thấy lỗi nhưng ống không phải của nó, nên dán nhãn rollback-only. a() bắt lỗi, chạy tiếp, tới lúc commit thì Spring thấy nhãn: rollback hết và ném UnexpectedRollbackException cho controller."}
                           : {x:0,y:0,ex:"RuntimeException",shared:true,note:"Lỗi bay ra khỏi a(), rollback cả ống."};
     return {x:0,y:0,ex:"RuntimeException",shared:true,note:"Ống chung: a() lỗi thì mất cả y dù b() đã chạy xong."};
   }
   if(prop==='REQUIRES_NEW'){
     if(err==='none') return {x:1,y:1,ex:null,shared:false,note:"b() có ống riêng (connection riêng), commit ngay khi b() xong; a() commit khi kết thúc."};
     if(err==='B') return caught? {x:1,y:0,ex:null,shared:false,note:"Ống riêng của b() nổ một mình và rollback. Ống của a() không bị dán nhãn, a() bắt lỗi rồi commit bình thường."}
                           : {x:0,y:0,ex:"RuntimeException",shared:false,note:"b() rollback ống riêng; lỗi tiếp tục bay ra khỏi a() nên a() cũng rollback."};
     return {x:0,y:1,ex:"RuntimeException",shared:false,note:"y đã được commit trong ống riêng trước khi a() lỗi, nên y còn, x mất. Đây là cách ghi log lỗi \"phải lưu dù việc chính hỏng\"."};
   }
   // NESTED
   if(err==='none') return {x:1,y:1,ex:null,shared:true,sp:true,note:"Dùng chung ống, có savepoint trước b(). Không lỗi thì commit cả hai ở cuối a()."};
   if(err==='B') return caught? {x:1,y:0,ex:null,shared:true,sp:true,note:"b() lỗi thì lùi về savepoint, chỉ mất y. a() bắt lỗi và commit x. Lưu ý: với JPA, entity trong bộ nhớ không lùi theo savepoint."}
                         : {x:0,y:0,ex:"RuntimeException",shared:true,sp:true,note:"Lỗi bay ra khỏi a(): rollback cả ống."};
   return {x:0,y:0,ex:"RuntimeException",shared:true,sp:true,note:"NESTED vẫn là chung ống: a() lỗi thì mất cả y."};
  };
  const draw=()=>{
   const r=calc(); const bd=(n,k)=>`<span class="bead ${k?'ok':'no'}">${n} ${k?'lưu':'mất'}</span>`;
   $('#tcode1').style.display=$('#tcode2').style.display = (caught&&err==='B')?'':'none';
   $('#tcode3').textContent = err==='A'?'throw new RuntimeException(); // a() lỗi':err==='B'?'// b() ném RuntimeException bên trong':'// không lỗi';
   el.querySelector('#tc').closest('label').style.opacity = err==='B'?1:.45;
   $('#ttubes').innerHTML = r.shared
     ? `<div class="tube ${r.x||r.y?'ok':'no'}"><h5>Ống của a()${r.sp?' · có savepoint':''}</h5>${bd('x',r.x)}${bd('y',r.y)}</div><div class="tube none"><h5>Không có ống riêng</h5><span class="muted" style="font-size:13px">${call==='self'?'this.b() không qua proxy':'b() tham gia ống của a()'}</span></div>`
     : `<div class="tube ${r.x?'ok':'no'}"><h5>Ống của a()</h5>${bd('x',r.x)}</div><div class="tube ${r.y?'ok':'no'}"><h5>Ống riêng của b()</h5>${bd('y',r.y)}</div>`;
   $('#tres').innerHTML=`<div class="res ${r.ex?'no':'ok'}"><b class="code">${r.ex?'Controller nhận: '+r.ex:'Không có exception tới controller'}</b>${r.note}</div>`;
   $('#tprog').innerHTML=progLine('lab-tx',labTry('lab-tx',[call,call==='self'?'-':prop,err,err==='B'?caught:'-'].join('|'),6),6);
  };
  wireSeg(el,(k,v)=>{ if(k==='call') call=v; if(k==='prop') prop=v; if(k==='err') err=v; draw(); });
  $('#tc').onchange=e=>{caught=e.target.checked;draw();};
  draw();
 }},

/* 5 ---------------- index */
{id:"lab-index", title:"Index nhiều cột có được dùng không", r:"data", icon:"db", lv:2, min:6, les:["indexing","n-plus-one"],
 desc:"Sắp thứ tự cột của index và chọn điều kiện truy vấn. Xem planner có dùng được index, dùng tới cột nào.",
 goal:"Thử 4 tổ hợp khác nhau.",
 run(el){
  const C=['tenant_id','status','created_at']; let idx=['tenant_id','status','created_at'];
  el.innerHTML=`<div class="lab-wrap"><div class="card pad ctl">
    <div class="fl">Index theo thứ tự cột</div>${[0,1,2].map(i=>`<select id="ix${i}" aria-label="Cột ${i+1}">${['(trống)',...C].map(c=>`<option ${idx[i]===c?'selected':''}>${c}</option>`).join('')}</select>`).join('')}
    <div class="fl" style="margin-top:6px">Điều kiện WHERE</div>
    <label class="row"><input type="checkbox" id="qt" checked> tenant_id = ?</label>
    <label class="row"><input type="checkbox" id="qs"> status = ?</label>
    <label class="row"><input type="checkbox" id="qc"> created_at trong một khoảng</label>
    <label class="row"><input type="checkbox" id="qf"> viết thành date(created_at) = ?</label>
    <label class="row"><input type="checkbox" id="qo"> ORDER BY created_at</label><div id="iprog"></div></div>
   <div style="display:grid;gap:14px;min-width:0"><pre class="log" id="isql" style="max-height:none"></pre><div id="ires"></div></div></div>`;
  const draw=()=>{
   idx=[0,1,2].map(i=>$('#ix'+i).value).filter(c=>c!=='(trống)'); idx=[...new Set(idx)];
   const q={tenant_id:$('#qt').checked?'eq':null,status:$('#qs').checked?'eq':null,created_at:$('#qc').checked?($('#qf').checked?'fn':'range'):null};
   const order=$('#qo').checked;
   const where=[q.tenant_id&&'tenant_id = ?',q.status&&'status = ?',q.created_at==='range'&&"created_at >= ? AND created_at < ?",q.created_at==='fn'&&'date(created_at) = ?'].filter(Boolean);
   $('#isql').textContent=`CREATE INDEX ON notification (${idx.join(', ')||'…'});\n\nSELECT * FROM notification\n${where.length?'WHERE '+where.join('\n  AND '):'-- không có điều kiện'}${order?'\nORDER BY created_at':''};`;
   const used=[]; let stopRange=false;
   for(const c of idx){ if(stopRange) break; const k=q[c]; if(k==='eq'){used.push(c);} else if(k==='range'){used.push(c);stopRange=true;} else break; }
   const nextAfterEq = idx[used.length]; const orderOk = order && ((nextAfterEq==='created_at' && !stopRange) || (used[used.length-1]==='created_at' && stopRange && used.length===idx.indexOf('created_at')+1));
   let cls='ok', head, msg;
   if(!idx.length){cls='info';head='Chưa có index';msg='Chọn ít nhất một cột.';}
   else if(!used.length){cls='no';head='Seq Scan (không dùng được index)';
     msg = q[idx[0]]==='fn'?'Cột đầu bị bọc trong hàm date(), index trên giá trị gốc không dùng được. Viết thành khoảng created_at >= … AND created_at < ….'
          : `Truy vấn không lọc theo cột đầu tiên (${idx[0]}) của index. Theo quy tắc cột bên trái, index sắp theo ${idx[0]} trước nên không nhảy thẳng tới được.`;}
   else { head=`Index Scan dùng ${used.length}/${idx.length} cột: ${used.join(', ')}`;
     const unused=Object.entries(q).filter(([c,k])=>k&&!used.includes(c)).map(([c])=>c);
     msg=`Planner đi theo index qua ${used.join(' → ')}.${unused.length?` Điều kiện trên ${unused.join(', ')} được lọc thêm sau khi đọc dòng (không nhờ index).`:''}${stopRange&&idx.indexOf(used[used.length-1])<idx.length-1?' Cột lọc theo khoảng chặn việc dùng các cột phía sau nó, vì vậy cột khoảng nên đặt cuối.':''}${order?(orderOk?' ORDER BY created_at được phục vụ luôn bởi thứ tự của index, không cần sắp xếp thêm.':' ORDER BY created_at cần thêm bước Sort vì thứ tự index không khớp.'):''}`;
     if(q.created_at==='fn') msg+=' date(created_at) không dùng được index trên created_at.';
   }
   $('#ires').innerHTML=`<div class="res ${cls}"><b class="code" style="font-size:15px">${head}</b>${msg}<br><span class="muted" style="font-size:13px">Đây là mô phỏng quy tắc. Planner thật còn xét thống kê: lấy phần lớn số dòng hoặc bảng nhỏ thì có thể chọn Seq Scan dù index dùng được.</span></div>`;
   $('#iprog').innerHTML=progLine('lab-index',labTry('lab-index',idx.join(',')+'|'+JSON.stringify(q)+order,4),4);
  };
  el.querySelectorAll('select,input').forEach(x=>x.onchange=draw); draw();
 }},

/* 6 ---------------- RabbitMQ consumer failure */
{id:"lab-mq", title:"Consumer gặp lỗi", r:"async", icon:"queue", lv:3, min:8, les:["consumer-failures","delivery-idempotency","messaging-basics"],
 desc:"Một message kết quả H5P tới consumer và xử lý bị lỗi. Bật tắt retry, DLQ, idempotency để xem message đi đâu và tiến độ có bị sai.",
 goal:"Chạy 4 cấu hình cho ra 4 kết cục khác nhau.",
 run(el){
  let kind='temp', retry=true, max=3, dlq=true, crash=false, idem=false;
  el.innerHTML=`<div class="lab-wrap"><div class="card pad ctl">
   <label>Loại lỗi${seg('kind',[['temp','Tạm thời (DB chậm, lần 3 thì được)'],['perm','Vĩnh viễn (dữ liệu sai)']],'temp')}</label>
   <label class="row"><input type="checkbox" id="mr" checked> Bật retry có giới hạn</label>
   <label for="mm">Số lần thử tối đa: <span id="mmv">3</span><input type="range" id="mm" min="1" max="5" value="3"></label>
   <label class="row"><input type="checkbox" id="md" checked> Queue có dead letter exchange (DLQ)</label>
   <label class="row"><input type="checkbox" id="mc"> Pod chết sau khi ghi DB, trước khi ack</label>
   <label class="row"><input type="checkbox" id="mi"> Consumer idempotent (tính lại từ dữ liệu gốc)</label>
   <button class="btn pri" type="button" id="mgo">${ic('play')}Gửi message</button><div id="mprog"></div></div>
   <div style="display:grid;gap:14px;min-width:0"><div class="log" id="mlog">Bấm "Gửi message" để chạy.</div><div id="mres"></div></div></div>`;
  wireSeg(el,(k,v)=>{kind=v;});
  const g=id=>el.querySelector(id);
  g('#mr').onchange=e=>retry=e.target.checked; g('#mm').oninput=e=>{max=+e.target.value;g('#mmv').textContent=max;};
  g('#md').onchange=e=>dlq=e.target.checked; g('#mc').onchange=e=>crash=e.target.checked; g('#mi').onchange=e=>idem=e.target.checked;
  g('#mgo').onclick=()=>{
   const L=[]; let out, cls; const okAt = kind==='temp'?3:Infinity; let progress=0;
   L.push('<span>→ publish h5p.result {studentId:42, lesson:7, score:10}</span>');
   if(crash){
     L.push('<span>[pod-a] nhận message, xử lý: tiến độ bài 7 +10%</span>'); progress+=10;
     L.push('<span class="e">[pod-a] ✗ pod bị kill trước khi ack</span>');
     L.push('<span class="w">RabbitMQ: message chưa ack → giao lại cho pod-b</span>');
     L.push(`<span>[pod-b] xử lý lại: ${idem?'tính lại tiến độ từ bảng kết quả → vẫn 10%':'tiến độ +10% lần nữa'}</span>`); if(!idem) progress+=10;
     L.push('<span class="s">[pod-b] ✓ ack</span>');
     out = idem? 'Message được xử lý hai lần nhưng tiến độ vẫn đúng 10% nhờ consumer idempotent.' : `Tiến độ thành ${progress}% thay vì 10%. Giao ít nhất một lần + cộng dồn = dữ liệu sai.`; cls = idem?'ok':'no';
   } else if(!retry){
     let n=0; while(n<8){ n++; if(n>=okAt){ L.push(`<span class="s">lần giao ${n}: ✓ xử lý thành công, ack</span>`); break; } L.push(`<span class="e">lần giao ${n}: ✗ exception → requeue mặc định → giao lại ngay</span>`); }
     if(n>=okAt && kind==='temp'){ out='Thành công sau 3 lần, nhưng các lần giao lại diễn ra liên tục không giãn cách, dồn thêm tải vào DB đang chậm.'; cls='info'; }
     else { L.push('<span class="w">… lặp vô hạn: poison message chiếm consumer, log ngập, CPU tăng</span>'); out='Không giới hạn số lần: message hỏng bị requeue mãi. Cần retry có giới hạn và DLQ.'; cls='no'; }
   } else {
     let n=0, ok=false; while(n<max){ n++; if(n>=okAt){ L.push(`<span class="s">lần thử ${n}: ✓ thành công, ack</span>`); ok=true; break; } L.push(`<span class="e">lần thử ${n}: ✗ exception</span>${n<max?` <span class="w">chờ ${2**(n-1)}s rồi thử lại</span>`:''}`); }
     if(ok){ out=`Lỗi tạm thời được retry có giãn cách xử lý sau ${n} lần, không ảnh hưởng message khác.`; cls='ok'; }
     else if(dlq){ L.push('<span class="w">hết số lần thử → reject, không requeue → dead letter exchange → DLQ</span>'); L.push('<span>⚑ cảnh báo: DLQ có 1 message</span>'); out='Message hỏng nằm trong DLQ, queue chính chạy tiếp. Sửa lỗi xong có thể đẩy lại từ DLQ.'+(kind==='perm'?' Với lỗi dữ liệu, nên ném AmqpRejectAndDontRequeueException để vào DLQ ngay, khỏi phí lượt thử.':''); cls='ok'; }
     else { L.push('<span class="e">hết số lần thử → reject, không requeue → không có dead letter → message bị bỏ</span>'); out='Message bị mất mà không ai biết. Bật retry thì phải cấu hình DLQ.'; cls='no'; }
   }
   g('#mlog').innerHTML=L.join('\n');
   g('#mres').innerHTML=`<div class="res ${cls}">${out}</div>`;
   const key = crash?(idem?'crash-idem':'crash-dup'):(!retry?(kind==='temp'?'noretry-temp':'loop'):(cls==='ok'&&g('#mlog').textContent.includes('DLQ')?'dlq':cls==='ok'?'retry-ok':'lost'));
   g('#mprog').innerHTML=progLine('lab-mq',labTry('lab-mq',key,4),4);
  };
 }},

{id:"lab-throughput", title:"Máy tính nút thắt", r:"perf", icon:"gauge", lv:2, min:7, les:["littles-law","threads-vt","pools"],
 desc:"Nhập số kết nối, số thread, thời gian chờ, thời gian CPU và pool DB. Xem thông lượng tối đa và tài nguyên nào là nút thắt.",
 goal:"Thử cả 4 kịch bản mẫu.",
 run(el){
  const P={
   a:{n:"API ngủ 1s · 200 thread",c:2000,v:false,t:200,io:1000,cpu:1,cores:10,pool:10,db:0},
   b:{n:"Cùng API · bật virtual thread",c:2000,v:true,t:200,io:1000,cpu:1,cores:10,pool:10,db:0},
   c:{n:"Bước xác thực tốn ~100ms CPU",c:2000,v:true,t:200,io:0,cpu:100,cores:10,pool:10,db:0},
   d:{n:"Virtual thread + DB giữ connection 0,5s",c:2000,v:true,t:200,io:500,cpu:2,cores:10,pool:10,db:500}
  };
  let s={...P.a}, pk='a';
  const F=[['c','Kết nối đồng thời (wrk -c)',1,5000],['t','Số thread Tomcat',1,1000],['io','Thời gian chờ I/O mỗi request (ms)',0,5000],['cpu','Thời gian CPU mỗi request (ms)',0,1000],['cores','Số nhân CPU',1,64],['pool','Connection pool (Hikari)',1,200],['db','Thời gian giữ connection (ms)',0,5000]];
  el.innerHTML=`<div class="lab-wrap"><div class="card pad ctl">
   <label>Kịch bản mẫu${seg('pre',Object.entries(P).map(([k,v])=>[k,v.n]),'a')}</label>
   <label class="row"><input type="checkbox" id="tv"> Bật virtual thread</label>
   ${F.map(f=>`<label for="f${f[0]}">${f[1]}<input type="number" id="f${f[0]}" min="${f[2]}" max="${f[3]}"></label>`).join('')}<div id="thprog"></div></div>
   <div style="display:grid;gap:14px;min-width:0"><div class="card pad"><div class="h-sec" style="margin-top:0">Trần thông lượng của từng tài nguyên (request/giây)</div><div class="caps" id="tcaps"></div></div><div id="tres2"></div></div></div>`;
  const fill=()=>{ F.forEach(f=>el.querySelector('#f'+f[0]).value=s[f[0]]); el.querySelector('#tv').checked=s.v; el.querySelector('#ft').disabled=s.v; };
  const draw=()=>{
   const R=Math.max(1,s.io+s.cpu)/1000;
   const caps=[['Kết nối của client',s.c/R],['Thread phục vụ',s.v?Infinity:s.t/R],['CPU',s.cpu>0?s.cores/(s.cpu/1000):Infinity],['Connection DB',s.db>0?s.pool/(s.db/1000):Infinity]];
   const fin=caps.filter(c=>isFinite(c[1])); const min=Math.min(...fin.map(c=>c[1])); const max=Math.max(...fin.map(c=>c[1]));
   el.querySelector('#tcaps').innerHTML=caps.map(c=>`<div class="cap ${c[1]===min?'min':''}"><span>${c[0]}</span><span class="track"><i style="width:${isFinite(c[1])?Math.max(2,100*c[1]/max):0}%"></i></span><span class="val">${isFinite(c[1])?Math.round(c[1]).toLocaleString('vi-VN'):'không giới hạn'}</span></div>`).join('');
   const b=caps.find(c=>c[1]===min)[0]; const lat=Math.max(R, s.c/min);
   const tip={ 'Kết nối của client':'Server còn dư sức; muốn đo trần thật thì tăng -c.', 'Thread phục vụ':'Mỗi request giữ một thread suốt lúc chờ. Bật virtual thread hoặc giảm thời gian chờ.', 'CPU':'Việc tốn CPU: virtual thread không giúp. Giảm chi phí CPU mỗi request (ví dụ bước băm mật khẩu) hoặc thêm máy.', 'Connection DB':'Giảm thời gian giữ connection (transaction ngắn, không gọi dịch vụ ngoài trong transaction) trước khi nghĩ tới tăng pool.' }[b];
   el.querySelector('#tres2').innerHTML=`<div class="res info"><b class="code">≈ ${Math.round(min).toLocaleString('vi-VN')} request/giây</b>Nút thắt: <b>${b}</b>. Độ trễ trung bình khi bão hòa ≈ ${lat>=10?Math.round(lat):lat.toFixed(2)} giây (định luật Little: ${s.c} kết nối ÷ ${Math.round(min)} req/s). ${tip}</div>`;
  };
  wireSeg(el,(k,v)=>{ pk=v; s={...P[v]}; fill(); draw(); el.querySelector('#thprog').innerHTML=progLine('lab-throughput',labTry('lab-throughput',v,4),4); });
  el.querySelector('#tv').onchange=e=>{s.v=e.target.checked; el.querySelector('#ft').disabled=s.v; draw();};
  F.forEach(f=>el.querySelector('#f'+f[0]).oninput=e=>{ const n=+e.target.value; if(n>=f[2]) { s[f[0]]=Math.min(n,f[3]); draw(); } });
  fill(); draw(); el.querySelector('#thprog').innerHTML=progLine('lab-throughput',labTry('lab-throughput','a',4),4);
 }},

/* 8 ---------------- cache invalidation race */
{id:"lab-cache", title:"Xóa cache trước hay sau commit", r:"perf", icon:"gauge", lv:2, min:5, les:["caching","rbac","outbox"],
 desc:"Quản trị đổi vai trò của một giáo viên trong khi giáo viên đó đang tải menu. Đi từng bước để thấy vì sao thứ tự xóa cache quan trọng.",
 goal:"Xem hết cả hai cách.",
 run(el){
  const M={
   before:{n:"Xóa cache trước khi commit",steps:[
    ["A","BEGIN, cập nhật vai trò trong DB (chưa commit)",""],
    ["A","Xóa cache menu của giáo viên",""],
    ["B","Giáo viên tải menu: cache miss",""],
    ["B","Đọc DB: thấy vai trò CŨ vì A chưa commit",""],
    ["B","Ghi menu CŨ vào cache","bad"],
    ["A","COMMIT: DB đã có vai trò mới",""],
    ["!","Cache giữ menu cũ tới khi hết TTL. DB và cache lệch.","bad"]]},
   after:{n:"Xóa cache sau khi commit",steps:[
    ["A","BEGIN, cập nhật vai trò trong DB (chưa commit)",""],
    ["B","Giáo viên tải menu: cache hit, menu cũ (chấp nhận được, chưa commit)",""],
    ["A","COMMIT",""],
    ["A","@TransactionalEventListener(AFTER_COMMIT): xóa cache",""],
    ["B","Lần tải sau: cache miss, đọc DB thấy vai trò MỚI, ghi vào cache",""],
    ["!","Cache khớp DB. Còn một khe nhỏ (nếu xóa cache thất bại) nên vẫn đặt TTL làm lưới an toàn.","ok"]]}
  };
  let m='before', i=0; const seen={before:false,after:false};
  el.innerHTML=`<div class="lab-wrap"><div class="card pad ctl"><label>Cách làm${seg('m',[['before','Xóa trước commit'],['after','Xóa sau commit']],'before')}</label>
   <div style="display:flex;gap:8px"><button class="btn" type="button" id="cprev">← Lùi</button><button class="btn pri" type="button" id="cnext">Bước tiếp →</button></div><div id="cprog"></div></div>
   <div class="card pad"><div class="lanes" id="clanes"></div><div id="cres" style="margin-top:14px"></div></div></div>`;
  const draw=()=>{ const st=M[m].steps;
   const lane=(who,label)=>`<div class="lane"><b>${label}</b><div class="steps">${st.map((s,k)=>s[0]===who&&k<=i?`<span class="st ${k===i?'hl':''} ${s[2]==='bad'?'badst':''}">${k+1}. ${s[1]}</span>`:'').join('')||'<span class="muted" style="font-size:12.5px;padding-top:6px">…</span>'}</div></div>`;
   el.querySelector('#clanes').innerHTML=lane('A','Request A · quản trị')+lane('B','Request B · giáo viên');
   const last=st[i]; el.querySelector('#cres').innerHTML = last[0]==='!'?`<div class="res ${last[2]==='bad'?'no':'ok'}">${last[1]}</div>`:`<div class="res info">Bước ${i+1}/${st.length}</div>`;
   el.querySelector('#cprev').disabled=i===0; el.querySelector('#cnext').disabled=i===st.length-1;
   if(i===st.length-1 && !seen[m]){ seen[m]=true; }
   el.querySelector('#cprog').innerHTML=progLine('lab-cache',(S.labTries['lab-cache']||[]).length,2);
   if(i===st.length-1){ el.querySelector('#cprog').innerHTML=progLine('lab-cache',labTry('lab-cache',m,2),2); }
  };
  wireSeg(el,(k,v)=>{m=v;i=0;draw();});
  el.querySelector('#cnext').onclick=()=>{i++;draw();}; el.querySelector('#cprev').onclick=()=>{i--;draw();};
  draw();
 }}
];
$("#sbtn").onclick=openSearch; route(); syncFromRepo();
</script>
