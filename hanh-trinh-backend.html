<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hành trình Backend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: left rail navigation + main workspace; map = topic regions laid as trails of lesson stations. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#F5F8F9; --fg:#14202B; --muted:#5A6A77; --line:#D6DFE4;
  --accent:#0C7A84; --accent-soft:#DDF1F2; --accent-ink:#FFFFFF; --xp:#B86E0B; --xp-soft:#FBEBD3;
  --good:#1E8449; --good-soft:#E0F3E8; --bad:#BC3A33; --bad-soft:#FBE4E2; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
  --r1:#2D68D2; --r2:#0C7A84; --r3:#7449C9; --r4:#AE4F2C; --r5:#25875A; --r6:#B47309; --r7:#4D6274; --r8:#9C3770;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --rad:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#141D25; --surface2:#1A252F; --fg:#E2E9EE; --muted:#92A2AF; --line:#25323D;
  --accent:#4CC0C8; --accent-soft:#143338; --accent-ink:#06191B; --xp:#F0AF48; --xp-soft:#3A2A10;
  --good:#5BC98A; --good-soft:#123222; --bad:#F07A72; --bad-soft:#3A1715; --shadow:0 1px 2px rgba(0,0,0,.3);
  --r1:#7AA6F2; --r2:#4CC0C8; --r3:#AA8AEB; --r4:#E58A66; --r5:#5BC98A; --r6:#EAB04F; --r7:#9AB0C2; --r8:#E07BB2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141D25; --surface2:#1A252F; --fg:#E2E9EE; --muted:#92A2AF; --line:#25323D;
  --accent:#4CC0C8; --accent-soft:#143338; --accent-ink:#06191B; --xp:#F0AF48; --xp-soft:#3A2A10;
  --good:#5BC98A; --good-soft:#123222; --bad:#F07A72; --bad-soft:#3A1715; --shadow:0 1px 2px rgba(0,0,0,.3);
  --r1:#7AA6F2; --r2:#4CC0C8; --r3:#AA8AEB; --r4:#E58A66; --r5:#5BC98A; --r6:#EAB04F; --r7:#9AB0C2; --r8:#E07BB2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:18px 12px 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;padding:4px 10px 14px;text-decoration:none;color:var(--fg)}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.rail-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--fg);font-size:14px;font-weight:500}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--xp);color:var(--surface);border-radius:999px;padding:1px 7px}
.lvl{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.lvl-top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.lvl-top span:last-child{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);border-radius:999px;transition:width .4s}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 24px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--muted);font-size:13px;min-width:200px}
.searchbtn kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.view{padding:24px max(24px,env(safe-area-inset-right,0px)) 48px 24px;max-width:1160px;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* mobile nav */
.mnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
  .mnav a{flex:none;text-decoration:none;color:var(--fg);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
  .mnav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .searchbtn{min-width:0}.searchbtn .lbl,.searchbtn kbd{display:none}
  .view{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}
/* common blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.h-sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:28px 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tag .dot{width:8px;height:8px;border-radius:50%}
.mono{font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip .dot{width:8px;height:8px;border-radius:50%}
/* home */
.hero{padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;overflow:hidden}
.hero h2{font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0 0 10px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{margin:0 0 18px;color:var(--muted);max-width:52ch}
.hero-flow{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.hero-flow span{border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface2);color:var(--fg)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.hero-flow{justify-content:flex-start}}
.stat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring::after{content:attr(data-l);width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.task:first-of-type{border-top:0}
.task .ic{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;flex:none}
.task .ic svg{width:18px;height:18px}
.task b{display:block;font-size:14px}.task small{color:var(--muted)}
.week{display:flex;gap:6px;margin-top:12px}
.week span{flex:1;text-align:center;font-size:11px;color:var(--muted);border-radius:8px;padding:6px 0;background:var(--surface2)}
.week span.on{background:var(--xp-soft);color:var(--xp);font-weight:700}
/* map */
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0 12px;margin:-8px 0 8px}
@media (max-width:900px){.jump{top:calc(env(safe-area-inset-top,0px) + 54px)}}
.region{padding:20px 22px 8px;margin-bottom:16px;scroll-margin-top:130px}
.region-h{display:flex;gap:14px;align-items:flex-start}
.region-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.region-ic svg{width:20px;height:20px}
.region-h h3{margin:0;font-size:18px;font-weight:700}
.region-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.region-prog{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);min-width:110px;font-variant-numeric:tabular-nums}
.region-prog .bar{margin-top:6px}
.region-prog .bar i{background:var(--rc)}
.trail{display:flex;gap:0;overflow-x:auto;padding:22px 4px 16px;scrollbar-width:thin}
.stn{flex:0 0 156px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;text-decoration:none;color:var(--fg);position:relative}
.stn::before{content:"";position:absolute;top:30px;left:-50%;width:100%;border-top:2px dashed var(--line);z-index:0}
.stn:first-child::before{display:none}
.stn.done::before{border-top-color:var(--rc)}
.stn .node{width:60px;height:60px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;position:relative;z-index:1;transition:transform .15s}
.stn:hover .node{transform:translateY(-2px);border-color:var(--rc)}
.stn .node svg{width:24px;height:24px;color:var(--rc)}
.stn.done .node{background:var(--rc);border-color:var(--rc)}
.stn.done .node svg{color:#fff}
.stn .ok{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px;border:2px solid var(--surface)}
.stn .lbl{font-size:13px;font-weight:600;line-height:1.3;padding:0 6px}
.stn .meta{font-size:11px;color:var(--muted)}
.stn.next .node{box-shadow:0 0 0 5px color-mix(in srgb,var(--rc) 22%,transparent)}
/* lesson */
.les-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:6px}
.les-title{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.015em;margin:4px 0 6px;text-wrap:balance;line-height:1.15}
.les-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:18px}
@media (max-width:980px){.les-grid{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:76px;display:grid;gap:14px}
@media (max-width:980px){.side{position:static}}
.callout{border-left:4px solid var(--rc,var(--accent));background:var(--surface2);border-radius:8px;padding:12px 14px;margin:0}
.callout.proj{border-left-color:var(--xp);background:var(--xp-soft)}
.callout b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.points{margin:0;padding-left:20px;display:grid;gap:9px}
.points li::marker{color:var(--rc,var(--accent))}
.pits{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pits li{padding:8px 12px;border-radius:8px;background:var(--bad-soft);font-size:14px}
.pits li::before{content:"Bẫy · ";font-weight:700;color:var(--bad)}
details.iv{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
details.iv summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px}
details.iv summary::-webkit-details-marker{display:none}
details.iv summary::before{content:"Hỏi";font-size:11px;font-weight:700;color:var(--r3);background:color-mix(in srgb,var(--r3) 14%,transparent);border-radius:6px;padding:2px 7px;height:fit-content;flex:none;margin-top:1px}
details.iv[open] summary{border-bottom:1px dashed var(--line)}
details.iv .ans{padding:12px 14px;font-size:14.5px}
/* flow diagram */
.flow{display:flex;flex-direction:column;gap:0;padding:6px 0}
.fnode{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;position:relative;padding-bottom:14px}
.fnode:last-child{padding-bottom:0}
.fnode::before{content:"";position:absolute;left:13px;top:28px;bottom:0;border-left:2px solid color-mix(in srgb,var(--rc) 40%,var(--line))}
.fnode:last-child::before{display:none}
.fnum{width:28px;height:28px;border-radius:8px;background:var(--rc);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;z-index:1}
.fbox b{display:block;font-size:14px;line-height:1.3;margin-top:3px}
.fbox span{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
/* quiz */
.q{padding:16px 18px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q p{margin:0 0 10px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:16px;flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:8px;background:var(--surface2)}
/* labs */
.labcard{display:flex;flex-direction:column;gap:8px;padding:16px 18px;text-decoration:none;color:var(--fg);transition:border-color .15s}
.labcard:hover{border-color:var(--muted)}
.labcard .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2)}
.labcard .ic svg{width:20px;height:20px;color:var(--rc)}
.labcard h4{margin:4px 0 0;font-size:15px}
.labcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.labcard .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lab-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.lab-wrap{grid-template-columns:minmax(0,1fr)}}
.ctl{display:grid;gap:14px}
.ctl label,.fl{display:grid;gap:6px;font-size:13px;font-weight:600}
.ctl select,.ctl input[type=number]{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl .row{display:flex;gap:8px;align-items:center;font-weight:500}
.ctl .row input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.layers{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);transition:all .25s}
.layer .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.layer b{font-size:14px}.layer small{display:block;color:var(--muted);font-size:12.5px}
.layer.pass{border-color:var(--good);background:var(--good-soft)}
.layer.stop{border-color:var(--bad);background:var(--bad-soft)}
.layer.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.layer.skip{opacity:.4}
.res{border-radius:10px;padding:14px 16px;font-size:14.5px}
.res.ok{background:var(--good-soft);border:1px solid var(--good)}
.res.no{background:var(--bad-soft);border:1px solid var(--bad)}
.res.info{background:var(--surface2);border:1px solid var(--line)}
.res b.code{font-family:var(--f-mono);font-size:18px;display:block;margin-bottom:4px}
.tubes{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.tubes{grid-template-columns:minmax(0,1fr)}}
.tube{border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:110px;background:var(--surface2)}
.tube h5{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tube.ok{border-color:var(--good)}.tube.no{border-color:var(--bad)}.tube.none{border-style:dashed;opacity:.6}
.bead{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:999px;margin:0 6px 6px 0;border:1px solid var(--line);background:var(--surface)}
.bead.ok{border-color:var(--good);color:var(--good)}.bead.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.log{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.log .e{color:var(--bad)}.log .s{color:var(--good)}.log .w{color:var(--xp)}
.caps{display:grid;gap:10px}
.cap{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
@media (max-width:560px){.cap{grid-template-columns:110px minmax(0,1fr) 78px}}
.cap .track{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.cap .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.cap.min .track i{background:var(--bad)}
.cap .val{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;height:46px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.tl .seg-ok{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.tl .seg-bad{position:absolute;top:0;bottom:0;background:var(--bad-soft);border-left:2px solid var(--bad)}
.tl .mk{position:absolute;top:0;bottom:0;border-left:2px dashed var(--fg)}
.tl .mk span{position:absolute;top:4px;left:4px;font-size:11px;font-family:var(--f-mono);white-space:nowrap}
.tl-ax{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.lane>b{padding-top:6px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.st{font-size:12.5px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.st.hl{border-color:var(--accent);background:var(--accent-soft)}
.st.badst{border-color:var(--bad);background:var(--bad-soft)}
/* reference */
.gl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.term{padding:14px 16px;display:grid;gap:6px;text-decoration:none;color:var(--fg)}
.term b{font-size:15px}.term p{margin:0;font-size:13.5px;color:var(--muted)}
.term .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px}
input.search{font:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px}
/* roadmap */
.wk{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wk .num b{display:block;font-size:26px;color:var(--fg);font-family:var(--f-ui);font-weight:800;line-height:1}
.wk h4{margin:0 0 4px;font-size:16px}
.wk p{margin:0 0 8px;color:var(--muted);font-size:14px}
.wk .out{font-size:13.5px;margin-top:8px}
.wk .out b{color:var(--xp)}
.wk.cur{background:var(--accent-soft)}
/* cards */
.flash{min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px;text-align:left;cursor:pointer;border:1px solid var(--line)}
.flash .side-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flash .fq{font-size:20px;font-weight:700;line-height:1.35;text-wrap:balance}
.flash .fa{font-size:15.5px;line-height:1.65}
/* exam */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.qgrid button{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;cursor:pointer}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--fg)}
.qgrid button.flag{border-color:var(--xp);background:var(--xp-soft)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
/* search modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:min(620px,100%);max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.modal .box input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px}
.sres{overflow:auto;padding:6px}
.sres a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:14px}
.sres a:hover,.sres a.on{background:var(--surface2)}
.sres a small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.toast{position:fixed;z-index:40;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .3s}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Điều hướng chính"></nav>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle">Trang chủ</h1>
      <button class="searchbtn" id="sbtn" type="button" aria-label="Tìm kiếm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="lbl">Tìm bài, thuật ngữ, lab</span><kbd>⌘K</kbd></button>
      <span class="pill" id="streakPill" style="color:var(--xp)" title="Chuỗi ngày học"></span>
      <span class="pill" id="xpPill" title="Tổng XP"></span>
    </header>
    <nav class="mnav" id="mnav" aria-label="Điều hướng"></nav>
    <main class="view" id="view"></main>
  </div>
</div>
<script>
const REGIONS = [
  {id:"http", name:"Nền móng HTTP", tag:"HTTP, REST và cách thiết kế API đúng chuẩn", icon:"globe", hue:"var(--r1)"},
  {id:"request", name:"Hành trình một request", tag:"Dữ liệu đi từ client tới DB và quay về như thế nào", icon:"route", hue:"var(--r2)"},
  {id:"security", name:"Bảo mật và danh tính", tag:"Xác thực, phân quyền, JWT, nhiều tenant", icon:"shield", hue:"var(--r3)"},
  {id:"data", name:"Dữ liệu và giao dịch", tag:"Transaction, khóa, index, N+1, EAV", icon:"db", hue:"var(--r4)"},
  {id:"perf", name:"Hiệu năng và đồng thời", tag:"Thread, virtual thread, pool, cache, đo đạc", icon:"gauge", hue:"var(--r5)"},
  {id:"async", name:"Giao tiếp bất đồng bộ", tag:"RabbitMQ, lỗi consumer, retry, DLQ, outbox", icon:"queue", hue:"var(--r6)"},
  {id:"ops", name:"Vận hành và sự cố", tag:"Môi trường, Kubernetes, quan sát, chịu lỗi", icon:"server", hue:"var(--r7)"},
  {id:"design", name:"Thiết kế hệ thống", tag:"Khung tư duy và các bài thiết kế thực tế", icon:"summit", hue:"var(--r8)"}
];

const LESSONS = [
/* ================= HTTP ================= */
{id:"http-basics", r:"http", title:"Giải phẫu một HTTP request", min:8,
 problem:"Mọi API đều là trao đổi HTTP. Không hiểu một request gồm những phần nào thì rất khó giải thích dữ liệu đi vào backend ra sao.",
 flow:[{t:"Method + URL",d:"GET /api/students?page=2"},{t:"Header",d:"Authorization, Content-Type, Accept"},{t:"Body",d:"JSON, chỉ có ở POST/PUT/PATCH"},{t:"Server xử lý",d:"đọc từng phần"},{t:"Response",d:"status + header + body"}],
 points:[
  "Một request gồm: method (GET, POST...), URL (đường dẫn + query string), header (metadata như token, kiểu dữ liệu) và body (dữ liệu gửi kèm, thường là JSON).",
  "HTTP là stateless: server không nhớ request trước. Mọi thứ cần để xử lý (ai đang gọi, tenant nào) phải nằm trong chính request, ví dụ JWT trong header Authorization.",
  "Status code chia 5 nhóm: 1xx thông tin, 2xx thành công, 3xx chuyển hướng, 4xx lỗi phía client, 5xx lỗi phía server.",
  "Hay dùng: 200 OK, 201 Created, 204 No Content, 400 Bad Request, 401 Unauthorized (chưa xác thực), 403 Forbidden (đã xác thực nhưng không có quyền), 404, 409 Conflict, 422, 500, 503.",
  "Content-Type cho server biết body là gì (application/json). Accept cho server biết client muốn nhận về dạng gì."
 ],
 pitfalls:["Nhầm 401 và 403: 401 là chưa biết bạn là ai, 403 là biết rồi nhưng không cho.","Trả 200 kèm {\"error\":...} trong body làm client và công cụ giám sát không nhận ra lỗi.","Đặt dữ liệu nhạy cảm vào query string: URL bị ghi vào log, lịch sử trình duyệt, proxy."],
 iv:[{q:"401 và 403 khác nhau thế nào?",a:"401 nghĩa là request chưa được xác thực: thiếu token hoặc token sai, hết hạn. 403 nghĩa là đã biết người gọi là ai nhưng họ không có quyền với tài nguyên đó."},
     {q:"HTTP stateless nghĩa là gì, ảnh hưởng gì tới thiết kế?",a:"Server không giữ trạng thái giữa các request. Mỗi request phải tự mang đủ thông tin, thường là token. Nhờ vậy có thể chạy nhiều instance phía sau load balancer mà request nào đến instance nào cũng xử lý được."}],
 project:"Trong hệ thống trường học, mỗi request từ FE mang JWT ở header Authorization. Gateway đọc token đó chứ không nhớ phiên đăng nhập. Đó là lý do có thể chạy nhiều pod.",
 rel:["rest-design","request-lifecycle","jwt"],
 quiz:[{q:"Người dùng đã đăng nhập nhưng gọi API xóa học sinh khi không có quyền. Trả mã nào?",o:["401","403","404","400"],a:1,w:"Đã xác thực (biết là ai) nhưng không có quyền → 403."},
       {q:"Phần nào của request nên chứa JWT?",o:["Query string","Header Authorization","Path variable","Cookie bắt buộc"],a:1,w:"Chuẩn là header Authorization: Bearer <token>. Query string bị ghi log."}]},

{id:"rest-design", r:"http", title:"Thiết kế REST đúng chuẩn", min:10,
 problem:"Người phỏng vấn nói hệ thống \"lệch chuẩn\" khi search dùng POST. Cần biết chuẩn REST là gì, và khi nào phá lệ là chấp nhận được.",
 flow:[{t:"Danh từ",d:"/students, /classes/{id}"},{t:"Method",d:"GET đọc, POST tạo..."},{t:"Status",d:"201, 204, 404, 409"},{t:"Đặc tính",d:"safe, idempotent"},{t:"Ngoại lệ",d:"POST /search khi bộ lọc phức tạp"}],
 points:[
  "URL là danh từ chỉ tài nguyên, số nhiều: /students, /students/42, /classes/7/students. Hành động thể hiện bằng method, không viết /getStudents.",
  "GET đọc, POST tạo mới, PUT thay toàn bộ, PATCH sửa một phần, DELETE xóa.",
  "Safe: không làm đổi dữ liệu (GET, HEAD). Idempotent: gọi nhiều lần cho cùng kết quả (GET, PUT, DELETE). POST không idempotent: gọi hai lần có thể tạo hai bản ghi.",
  "Tìm kiếm là thao tác đọc nên chuẩn là GET + query param. Lợi ích: cache được, lưu được thành link, nhìn method là biết không đổi dữ liệu.",
  "POST /search là ngoại lệ được chấp nhận rộng rãi khi bộ lọc là JSON lồng phức tạp, URL quá dài, hoặc dữ liệu lọc nhạy cảm. Elasticsearch có API _search nhận POST. IETF đang soạn thảo method QUERY (an toàn nhưng có body) cho đúng trường hợp này."
 ],
 pitfalls:["Dùng POST cho mọi thứ: mất ngữ nghĩa, mất cache.","Động từ trong URL: /deleteStudent?id=1.","Trả 200 cho tạo mới thay vì 201 kèm header Location."],
 iv:[{q:"Vì sao search dùng POST bị coi là lệch chuẩn? Hệ thống em dùng POST thì bảo vệ thế nào?",a:"Theo REST, tìm kiếm là đọc nên dùng GET: an toàn, cache được, chia sẻ được link. Hệ thống em dùng POST /search vì bộ lọc trên EAV là JSON động lồng nhiều điều kiện, đưa lên URL quá dài và khó đọc. Nếu thiết kế lại, em dùng GET cho tìm kiếm đơn giản và giữ POST /search cho tìm kiếm phức tạp, đặt tên rõ để người đọc biết đó là thao tác đọc."},
     {q:"PUT và PATCH khác nhau thế nào?",a:"PUT gửi toàn bộ tài nguyên, thay thế bản cũ, nên idempotent. PATCH chỉ gửi phần thay đổi. PATCH có thể idempotent hoặc không, tùy cách định nghĩa thao tác."}],
 project:"Các API search của nền tảng EAV đều là POST. Đây là quyết định có lý do. Khi bị hỏi, hãy thừa nhận quy ước, nêu lý do, rồi nêu cách cải thiện.",
 rel:["api-practices","eav","http-basics"],
 quiz:[{q:"Method nào KHÔNG idempotent theo chuẩn?",o:["GET","PUT","DELETE","POST"],a:3,w:"POST gọi hai lần có thể tạo hai bản ghi."},
       {q:"Đường dẫn nào đúng phong cách REST nhất để lấy học sinh của lớp 7?",o:["/getStudentsByClass?classId=7","/classes/7/students","/student/list/7","/api/searchStudent"],a:1,w:"Danh từ, phân cấp tài nguyên, hành động nằm ở method GET."}]},

{id:"api-practices", r:"http", title:"Phân trang, lỗi, version và idempotency key", min:9,
 problem:"Một API dùng được lâu dài cần nhiều hơn method đúng: phân trang không sập khi dữ liệu lớn, lỗi có cấu trúc, và thay đổi không làm vỡ client cũ.",
 flow:[{t:"Phân trang",d:"offset hoặc cursor"},{t:"Lỗi chuẩn",d:"Problem Details"},{t:"Version",d:"/v1, header"},{t:"Idempotency key",d:"chống tạo trùng"}],
 points:[
  "Offset (page=50&size=20): dễ làm nhưng trang càng sâu càng chậm vì DB vẫn phải đếm bỏ các dòng phía trước, và dễ lặp hoặc sót khi dữ liệu thay đổi giữa hai lần gọi.",
  "Cursor/keyset (after=id_cuoi): WHERE id > ? ORDER BY id LIMIT 20. Nhanh đều ở mọi trang, ổn định khi có dữ liệu mới. Đổi lại không nhảy thẳng tới trang 50 được.",
  "Lỗi nên có cấu trúc thống nhất. Chuẩn RFC 9457 (Problem Details): type, title, status, detail, instance. Spring 6 hỗ trợ sẵn ProblemDetail.",
  "Version API khi có thay đổi phá vỡ: /api/v1/... hoặc header. Thêm field mới không cần version mới.",
  "Idempotency key: client gửi kèm một mã duy nhất cho thao tác POST quan trọng (thanh toán, ký). Server lưu mã đã xử lý, gặp lại thì trả kết quả cũ thay vì làm lại."
 ],
 pitfalls:["Trả nguyên stack trace trong response lỗi: lộ thông tin nội bộ.","Không giới hạn size: client gọi size=100000 làm sập DB.","Đếm tổng số dòng (COUNT) trên bảng lớn ở mọi lần phân trang."],
 iv:[{q:"Phân trang offset có vấn đề gì với bảng lớn?",a:"Trang càng sâu càng chậm vì DB phải quét và bỏ qua toàn bộ các dòng trước offset. Dữ liệu thay đổi giữa hai lần gọi gây lặp hoặc sót. Với danh sách dài hoặc cuộn vô hạn nên dùng keyset: WHERE id > id_cuối LIMIT n, có index trên cột sắp xếp."},
     {q:"Làm sao để người dùng bấm nút ký hai lần không tạo hai giao dịch?",a:"Phía client chặn bấm lặp chỉ là lớp phụ. Phía server dùng idempotency key hoặc câu UPDATE có điều kiện (WHERE signed = false) để chỉ một lần thành công, kèm unique constraint làm lớp chặn cuối."}],
 project:"Luồng ký số SmartCA nhiều file là ứng viên tốt cho idempotency key: mạng chập chờn khiến FE gửi lại, server không được tạo giao dịch ký thứ hai.",
 rel:["rest-design","locking","delivery-idempotency"],
 quiz:[{q:"Danh sách thông báo cuộn vô hạn, hàng triệu dòng. Phân trang nào hợp nhất?",o:["Offset","Keyset/cursor","Tải hết rồi cắt ở FE","Không phân trang"],a:1,w:"Keyset nhanh đều ở mọi vị trí và ổn định khi có dữ liệu mới."},
       {q:"Idempotency key giải quyết vấn đề gì?",o:["Tăng tốc truy vấn","Chống xử lý trùng khi client gửi lại cùng một thao tác","Mã hóa dữ liệu","Phân quyền"],a:1,w:"Server nhận ra thao tác đã xử lý và trả lại kết quả cũ."}]},

/* ================= REQUEST ================= */
{id:"request-lifecycle", r:"request", title:"Request đi qua Spring Boot thế nào", min:12,
 problem:"Câu bị đánh trượt: \"chưa hiểu cách dữ liệu đi vào một request\". Đây là bức tranh toàn cảnh từ lúc request tới server đến lúc response quay về.",
 flow:[{t:"Tomcat",d:"nhận kết nối, giao thread"},{t:"Filter chain",d:"CORS, Security, JWT"},{t:"DispatcherServlet",d:"tìm handler"},{t:"Argument resolver",d:"@PathVariable, @RequestBody"},{t:"Controller → Service",d:"proxy @Transactional"},{t:"Repository → DB",d:"Hikari, Hibernate"},{t:"Message converter",d:"object → JSON"}],
 points:[
  "Tomcat nhận kết nối TCP, đọc HTTP, giao request cho một thread (platform hoặc virtual).",
  "Filter chain chạy trước Spring MVC. Spring Security là một chuỗi filter: đọc JWT, xác thực, kiểm tra quyền. Bị chặn ở đây thì request không bao giờ tới controller (401/403).",
  "DispatcherServlet là cửa chính của Spring MVC. Nó hỏi HandlerMapping xem URL + method ứng với hàm controller nào. Không có thì 404, sai method thì 405.",
  "Interceptor (HandlerInterceptor) chạy quanh controller: preHandle, postHandle, afterCompletion.",
  "Argument resolver gán dữ liệu vào tham số: @PathVariable, @RequestParam từ URL; @RequestHeader từ header; @RequestBody qua HttpMessageConverter (Jackson) từ JSON; @Valid kiểm tra ràng buộc.",
  "Controller gọi service qua proxy (transaction mở ở đây), service gọi repository, Hibernate lấy connection từ HikariCP và chạy SQL.",
  "Đường về: giá trị trả về được Jackson chuyển thành JSON. Exception được @ControllerAdvice biến thành response lỗi."
 ],
 pitfalls:["@Controller thay vì @RestController: chuỗi trả về bị hiểu là tên view.","Tên trong {timelock} khác tham số timeLock: MissingPathVariableException.","Nghĩ Security nằm trong controller: thực ra nó chặn từ filter, trước cả DispatcherServlet."],
 iv:[{q:"Mô tả đường đi của một request trong ứng dụng Spring Boot.",a:"Tomcat nhận kết nối và giao cho một thread. Request đi qua filter chain, trong đó Spring Security xác thực JWT và kiểm tra quyền. Sau đó DispatcherServlet dùng HandlerMapping tìm hàm controller, interceptor chạy trước, argument resolver gán @PathVariable, @RequestParam, @RequestBody (Jackson) và validate. Controller gọi service qua proxy transaction, service gọi repository, Hibernate lấy connection từ Hikari để chạy SQL. Kết quả được Jackson chuyển thành JSON; nếu có exception thì @ControllerAdvice chuyển thành response lỗi."},
     {q:"Request bị 401 thì nó dừng ở tầng nào?",a:"Ở filter chain của Spring Security, trước DispatcherServlet. Controller không hề được gọi."}],
 project:"Trong microservices của dự án, trước Tomcat còn có API Gateway: gateway xác thực JWT, định tuyến tới service. Tự vẽ lại đường đi của request ký số từ FE tới bảng DB là bài luyện tốt nhất cho phần này.",
 rel:["binding-validation","exception-handling","authn-authz","propagation"],
 quiz:[{q:"Thành phần nào chọn hàm controller ứng với URL?",o:["Filter","HandlerMapping qua DispatcherServlet","Hibernate","Jackson"],a:1,w:"DispatcherServlet hỏi HandlerMapping."},
       {q:"Thiếu token, controller có được gọi không?",o:["Có, rồi trả 401","Không, Security filter chặn trước","Có nếu dùng @RestController","Tùy Jackson"],a:1,w:"Filter chain chạy trước DispatcherServlet."},
       {q:"Ai chuyển JSON trong body thành object Java?",o:["Tomcat","HttpMessageConverter (Jackson)","HikariCP","HandlerMapping"],a:1,w:"@RequestBody dùng HttpMessageConverter."}]},

{id:"binding-validation", r:"request", title:"Binding, validation và @RestController", min:8,
 problem:"Rất nhiều lỗi 400/500 khó hiểu đến từ bước gán dữ liệu vào tham số: sai tên, sai kiểu, quên annotation.",
 flow:[{t:"URL /students/7",d:"@PathVariable"},{t:"?page=2",d:"@RequestParam"},{t:"Header",d:"@RequestHeader"},{t:"JSON body",d:"@RequestBody + Jackson"},{t:"@Valid",d:"lỗi → 400"}],
 points:[
  "@PathVariable khớp theo tên, phân biệt hoa thường: {timeLock} phải trùng tên tham số, hoặc ghi rõ @PathVariable(\"timeLock\").",
  "Sai kiểu (\"abc\" vào Integer) → MethodArgumentTypeMismatchException → 400.",
  "@RequestBody đọc JSON bằng Jackson. JSON hỏng → HttpMessageNotReadableException → 400.",
  "@Valid + Bean Validation (@NotNull, @Size, @Email) trên DTO. Không đạt → MethodArgumentNotValidException → 400 kèm danh sách lỗi.",
  "@RestController = @Controller + @ResponseBody: giá trị trả về ghi thẳng vào body. @Controller thì chuỗi trả về là tên view.",
  "Nhận DTO, không nhận entity trực tiếp: tránh client gán được field không mong muốn (mass assignment) và tách API khỏi cấu trúc DB."
 ],
 pitfalls:["Nhận entity JPA làm @RequestBody: client sửa được id, trạng thái.","Quên @Valid nên các ràng buộc không chạy.","Hàm handler để static: không đi qua cơ chế bean."],
 iv:[{q:"@Controller và @RestController khác nhau thế nào?",a:"Về bean thì giống nhau, đều là @Component. @RestController có sẵn @ResponseBody nên giá trị trả về được HttpMessageConverter ghi vào body (thường là JSON). @Controller coi chuỗi trả về là tên view để ViewResolver render HTML."},
     {q:"Vì sao không nên nhận entity làm @RequestBody?",a:"Client có thể gửi thêm field như id, trạng thái, quyền và chúng bị gán thẳng vào entity. API cũng bị dính chặt với cấu trúc DB. Dùng DTO với đúng những field cho phép và validate trên đó."}],
 project:"Lỗi benchmark trước đây: dùng @Controller nên chuỗi OK::VirtualThread bị hiểu là tên view, Spring forward sang /benchmark/OKVirtualThread[... và lại khớp {timeLock} nên ra 400. Đó là một ví dụ thật cho cả bài này.",
 rel:["request-lifecycle","exception-handling"],
 quiz:[{q:"Gọi /students/abc vào @PathVariable Integer id. Kết quả?",o:["404","400 do sai kiểu","500","200 với id null"],a:1,w:"MethodArgumentTypeMismatchException được Spring map thành 400."},
       {q:"Annotation nào kích hoạt kiểm tra @NotNull trên DTO?",o:["@RequestBody","@Valid","@Component","@Transactional"],a:1,w:"@Valid (hoặc @Validated)."}]},

{id:"exception-handling", r:"request", title:"Xử lý lỗi tập trung", min:7,
 problem:"Lỗi ở mọi tầng cuối cùng phải thành một response rõ ràng cho client và một dòng log đủ thông tin cho người vận hành.",
 flow:[{t:"Exception",d:"ném từ service"},{t:"@ControllerAdvice",d:"bắt theo loại"},{t:"Map status",d:"4xx hay 5xx"},{t:"Response",d:"ProblemDetail"},{t:"Log",d:"kèm traceId"}],
 points:[
  "@RestControllerAdvice + @ExceptionHandler bắt exception theo loại ở một chỗ, thay vì try/catch rải rác trong controller.",
  "Lỗi do client (dữ liệu sai, không tìm thấy, xung đột trạng thái) → 4xx. Lỗi do hệ thống (DB sập, bug) → 5xx.",
  "Tạo exception nghiệp vụ riêng: NotFoundException → 404, AlreadySignedException → 409.",
  "Response lỗi không chứa stack trace. Log phía server thì phải đủ: stack trace, traceId, user, tenant.",
  "Exception bị nuốt trong service @Transactional làm transaction vẫn commit: xử lý lỗi sai chỗ còn ảnh hưởng tới dữ liệu."
 ],
 pitfalls:["catch (Exception e) { return null; }: lỗi biến mất, client nhận dữ liệu rỗng.","Mọi lỗi đều 500 làm client không biết là lỗi của mình.","Log lỗi hai lần ở hai tầng gây nhiễu."],
 iv:[{q:"Em xử lý exception trong Spring thế nào?",a:"Dùng @RestControllerAdvice bắt tập trung: exception nghiệp vụ map sang 4xx phù hợp, lỗi không lường trước thành 500. Response theo một cấu trúc thống nhất như ProblemDetail, không lộ stack trace. Log đầy đủ phía server kèm traceId để tra ngược."}],
 project:"Khi FE báo lỗi, có traceId trong response là có thể tìm ngay log tương ứng trên đúng pod, thay vì lục log cả ba môi trường.",
 rel:["request-lifecycle","observability","propagation"],
 quiz:[{q:"Người dùng ký một hồ sơ đã được ký. Mã nào hợp lý nhất?",o:["200","400","409 Conflict","500"],a:2,w:"Xung đột với trạng thái hiện tại của tài nguyên → 409."}]},

{id:"filters-interceptors", r:"request", title:"Filter, Interceptor hay AOP", min:6,
 problem:"Ba cách chèn logic chạy quanh request. Chọn sai chỗ thì hoặc không chạy, hoặc chạy thừa.",
 flow:[{t:"Filter",d:"tầng Servlet, mọi request"},{t:"Interceptor",d:"tầng Spring MVC, quanh handler"},{t:"AOP",d:"quanh method của bean"}],
 points:[
  "Filter (jakarta.servlet.Filter): chạy trước cả Spring MVC, thấy mọi request kể cả tài nguyên tĩnh. Hợp cho bảo mật, CORS, gắn traceId, đọc tenant từ token.",
  "HandlerInterceptor: chạy khi đã biết handler nào xử lý. Hợp cho log thời gian xử lý, kiểm tra theo annotation trên controller.",
  "AOP (@Aspect): bọc quanh method của bất kỳ bean nào, không chỉ controller. @Transactional, @Cacheable, @Async đều là AOP qua proxy.",
  "Thứ tự: Filter → DispatcherServlet → Interceptor.preHandle → Controller → (AOP quanh service) → Interceptor.afterCompletion → Filter."
 ],
 pitfalls:["Đặt logic bảo mật trong interceptor: request bị chặn trễ hơn và dễ bỏ sót đường dẫn.","Quên rằng AOP không chạy khi gọi this.method()."],
 iv:[{q:"Muốn gắn tenant từ JWT vào ngữ cảnh cho mọi tầng dùng, em đặt ở đâu?",a:"Ở một filter chạy sau bước xác thực: đọc claim tenant từ token đã kiểm tra, đặt vào ngữ cảnh request (ThreadLocal hoặc ScopedValue), và dọn dẹp trong finally."}],
 project:"Việc gắn tenant và vai trò từ token cho các service là ví dụ đúng của filter.",
 rel:["request-lifecycle","multi-tenant","propagation"],
 quiz:[{q:"@Transactional được hiện thực bằng cơ chế nào?",o:["Filter","Interceptor","AOP proxy","Jackson"],a:2,w:"Proxy AOP bọc quanh bean."}]},

/* ================= SECURITY ================= */
{id:"authn-authz", r:"security", title:"Xác thực, phân quyền và Spring Security", min:8,
 problem:"Authentication trả lời \"bạn là ai\", authorization trả lời \"bạn được làm gì\". Spring Security bật lên là khóa mọi thứ, nên phải hiểu nó chạy ra sao.",
 flow:[{t:"Request",d:"kèm token"},{t:"Authentication filter",d:"xác minh token"},{t:"SecurityContext",d:"lưu người dùng"},{t:"Authorization",d:"kiểm tra quyền"},{t:"Controller",d:"hoặc 401/403"}],
 points:[
  "Authentication: xác minh danh tính (mật khẩu, token). Authorization: quyết định có được làm hành động không (vai trò, quyền).",
  "Session: server lưu phiên, client giữ cookie session id. Token (JWT): server không lưu, token tự mang thông tin và chữ ký.",
  "Chỉ cần có spring-boot-starter-security, Boot khóa mọi endpoint, tạo user mặc định với mật khẩu in ra log, bật form login và HTTP Basic, bật CSRF.",
  "Khai báo bean SecurityFilterChain để tự cấu hình: endpoint nào permitAll, endpoint nào cần vai trò nào.",
  "Sau khi xác thực, thông tin người dùng nằm trong SecurityContextHolder (mặc định là ThreadLocal), các tầng sau đọc được."
 ],
 pitfalls:["Nghĩ \"chưa có SecurityConfig là chưa có bảo mật\": starter đã tự bật cấu hình mặc định.","Benchmark mà để bật xác thực: đo luôn cả chi phí xác thực."],
 iv:[{q:"Authentication và authorization khác nhau thế nào?",a:"Authentication xác minh người gọi là ai, ví dụ kiểm tra chữ ký JWT. Authorization quyết định người đó có được làm việc này không, dựa trên vai trò hoặc quyền. Thất bại ở bước đầu là 401, ở bước sau là 403."}],
 project:"Lần benchmark kẹt 100 request/giây dù endpoint không làm gì, bỏ Spring Security đi thì lên khoảng 30.000. Câu chuyện này cho thấy filter bảo mật chạy cho mọi request và có chi phí.",
 rel:["jwt","request-lifecycle","rbac"],
 quiz:[{q:"Thêm spring-boot-starter-security mà không cấu hình gì. Điều gì xảy ra?",o:["Không có gì thay đổi","Mọi endpoint yêu cầu đăng nhập","Chỉ /admin bị khóa","App không khởi động"],a:1,w:"Cấu hình mặc định khóa tất cả."}]},

{id:"jwt", r:"security", title:"JWT thực sự là gì", min:10,
 problem:"Trả lời \"JWT chủ yếu để chặn đăng nhập\" là chưa đúng. JWT là thẻ ra vào được cấp sau khi đăng nhập, được kiểm tra ở mọi request.",
 flow:[{t:"Đăng nhập",d:"user + mật khẩu"},{t:"Server ký JWT",d:"header.payload.signature"},{t:"Client gửi kèm",d:"Authorization: Bearer"},{t:"Server kiểm chữ ký",d:"+ hạn dùng"},{t:"Đọc claims",d:"user, role, tenant"}],
 points:[
  "JWT gồm ba phần base64url nối bằng dấu chấm: header (thuật toán), payload (claims), signature.",
  "Payload chỉ được mã hóa base64, KHÔNG được mã hóa bí mật: ai cũng đọc được. Không để mật khẩu hay dữ liệu nhạy cảm vào đó.",
  "Chữ ký đảm bảo không ai sửa được nội dung mà không bị phát hiện. HS256 dùng một khóa bí mật chung. RS256 dùng khóa riêng để ký, khóa công khai để kiểm, hợp với nhiều service.",
  "Claims chuẩn: sub (người dùng), exp (hết hạn), iat (thời điểm cấp), jti (mã token). Claims tự thêm: role, tenant.",
  "Ưu điểm: stateless, service nào có khóa kiểm đều tự xác thực được, không cần tra session. Nhược điểm lớn: đã cấp thì không thu hồi được cho tới khi hết hạn."
 ],
 pitfalls:["Lưu JWT trong localStorage: script độc (XSS) đọc được. Cookie HttpOnly an toàn hơn trước XSS nhưng phải xử lý CSRF.","Access token sống nhiều ngày.","Không kiểm tra thuật toán (alg none)."],
 iv:[{q:"JWT dùng để làm gì?",a:"JWT là token do server ký, cấp sau khi đăng nhập thành công. Mỗi request gửi kèm token, server kiểm tra chữ ký và hạn dùng để biết người gọi là ai mà không cần lưu session, nên dễ mở rộng ra nhiều service. Trong token có claims như user, vai trò, tenant để phân quyền. Vì không thu hồi được trước hạn nên dùng access token ngắn hạn kèm refresh token."},
     {q:"Payload JWT có bí mật không?",a:"Không. Payload chỉ base64url, ai cầm token cũng giải mã đọc được. Chữ ký chỉ chống sửa, không chống đọc."}],
 project:"Chị đã nâng hệ thống từ một token sang access token + refresh token, và đưa vai trò vào token để các service xử lý sự kiện không phải gọi service phân quyền. Đó là hai quyết định thiết kế có thể kể kèm lý do.",
 rel:["access-refresh","multi-tenant","authn-authz"],
 quiz:[{q:"Ai đọc được payload của JWT?",o:["Chỉ server","Bất kỳ ai có token","Không ai","Chỉ người có khóa riêng"],a:1,w:"Payload chỉ là base64url."},
       {q:"Điểm yếu cố hữu của JWT stateless là gì?",o:["Chậm","Không thu hồi được trước khi hết hạn","Không chứa được role","Chỉ dùng với session"],a:1,w:"Server không lưu nên không có chỗ để \"gạch\" token, trừ khi thêm cơ chế phụ."}]},

{id:"access-refresh", r:"security", title:"Access token, refresh token và khi đổi quyền", min:10,
 problem:"Câu hỏi phỏng vấn: đổi quyền của user rồi thì JWT đang chứa vai trò cũ xử lý thế nào?",
 flow:[{t:"Access token",d:"5–15 phút"},{t:"Hết hạn",d:"401"},{t:"Refresh token",d:"đổi lấy AT mới"},{t:"Server đọc DB",d:"vai trò hiện tại"},{t:"AT mới",d:"quyền mới"}],
 points:[
  "Access token ngắn hạn để nếu bị lộ thì thiệt hại ngắn. Refresh token dài hạn, chỉ gửi tới endpoint làm mới, được server lưu nên thu hồi được.",
  "Rotation: mỗi lần làm mới cấp refresh token mới và vô hiệu cái cũ. Refresh token cũ bị dùng lại là dấu hiệu bị đánh cắp.",
  "Đổi quyền, cách 1: chấp nhận độ trễ, quyền mới có hiệu lực khi access token hết hạn và được làm mới.",
  "Cách 2: thu hồi refresh token của user và lưu \"thời điểm đổi quyền\" (hoặc số version) vào Redis. Gateway so iat của token với thời điểm đó, token cũ hơn thì từ chối để client làm mới.",
  "Cách 3: danh sách đen jti trong Redis tới khi token hết hạn.",
  "Cách 4: không để quyền chi tiết trong token. Token chỉ có user + tenant, quyền tra từ cache, đổi quyền thì cập nhật cache là có hiệu lực ngay."
 ],
 pitfalls:["Cách 2 và 3 làm mất một phần tính stateless: mỗi request tra Redis.","Quên thu hồi refresh token khi đổi mật khẩu hoặc khóa tài khoản."],
 iv:[{q:"Đổi vai trò của user thì JWT chứa vai trò cũ xử lý thế nào?",a:"JWT không sửa được sau khi cấp nên vai trò trong token sẽ cũ tới khi hết hạn. Bên em xử lý hai tầng: quyền chi tiết theo menu nằm trong cache Redis và được đồng bộ ngay khi đổi vai trò nên có hiệu lực ngay; vai trò trong access token được cập nhật khi token hết hạn và làm mới. Nếu cần hiệu lực tức thì, em thu hồi refresh token và lưu thời điểm đổi quyền vào Redis để gateway từ chối token cấp trước thời điểm đó."}],
 project:"Hệ thống của chị đang kết hợp cách 1 và cách 4: vai trò trong token, menu chi tiết trong Redis. Kiểm tra lại code để nói đúng thời hạn access token và luồng làm mới thực tế.",
 rel:["jwt","rbac","caching"],
 quiz:[{q:"Muốn quyền mới có hiệu lực gần như ngay lập tức mà vẫn dùng JWT, cách nào hợp?",o:["Tăng hạn access token","Lưu thời điểm đổi quyền vào Redis, gateway từ chối token cấp trước đó","Bỏ chữ ký","Lưu JWT vào DB"],a:1,w:"So iat với thời điểm đổi quyền, buộc client làm mới."}]},

{id:"multi-tenant", r:"security", title:"Nhiều tenant: tin tenant ở đâu", min:9,
 problem:"Câu hỏi phỏng vấn: tenant đã có trong JWT, sao còn truyền trên path variable? Bản chất là: nguồn sự thật về tenant là gì và có tin được không.",
 flow:[{t:"JWT",d:"claim tenant (đã ký)"},{t:"Gateway/filter",d:"đọc và kiểm tra"},{t:"Ngữ cảnh request",d:"TenantContext"},{t:"Truy vấn",d:"WHERE tenant_id = ?"}],
 points:[
  "Mọi thứ client gửi (path, query, header tự đặt, body) đều sửa được. Chỉ claim trong token đã ký là client không sửa được.",
  "Nguồn sự thật nên là tenant trong JWT. Filter hoặc gateway đọc nó, đặt vào ngữ cảnh request, tầng dưới dùng từ đó.",
  "Tenant xuất hiện thêm trên path là thừa và có thể mâu thuẫn. Nếu buộc phải giữ (ví dụ admin cấp cao chuyển trường), server phải đối chiếu với token, lệch thì 403.",
  "Gateway gắn tenant từ token vào header cho service nội bộ là cách làm phổ biến, với hai điều kiện: gateway luôn ghi đè header client gửi, và service chỉ nhận traffic qua gateway.",
  "Ba mức cách ly dữ liệu: chung bảng có cột tenant_id (rẻ, dễ rò nếu quên điều kiện), schema riêng mỗi tenant, DB riêng mỗi tenant (cách ly mạnh nhất, tốn nhất)."
 ],
 pitfalls:["Một câu query quên WHERE tenant_id là rò dữ liệu chéo giữa các trường.","Tin header X-Tenant-ID do client gửi."],
 iv:[{q:"Tenant đã có trong JWT, sao còn truyền trên path?",a:"Đúng là thừa. Tenant trên path do client gửi nên sửa được. Nếu server dùng giá trị đó để truy vấn mà không đối chiếu token thì người trường A có thể đổi URL để đọc dữ liệu trường B. Cách đúng là lấy tenant từ token làm nguồn chính; nếu giữ trên path thì phải kiểm tra khớp với token, lệch thì trả 403."}],
 project:"Mở code xem server có đối chiếu tenant trên path với token không. Có thì nói hệ thống đã kiểm tra; chưa thì nói đây là điểm cần sửa và cách sửa.",
 rel:["jwt","filters-interceptors","case-school"],
 quiz:[{q:"Nguồn tenant đáng tin nhất?",o:["Path variable","Header client tự gửi","Claim trong JWT đã kiểm chữ ký","Body JSON"],a:2,w:"Client không sửa được nội dung đã ký."}]},

{id:"rbac", r:"security", title:"RBAC, cache quyền và đồng bộ", min:9,
 problem:"Phân quyền theo vai trò khó nhất ở chỗ giữ quyền và menu được cache luôn khớp với dữ liệu gốc mỗi khi đổi vai trò hay đổi menu.",
 flow:[{t:"User",d:""},{t:"Vai trò / chức vụ",d:"n-n"},{t:"Quyền",d:"menu, entity, hành động"},{t:"Bảng quyền tính sẵn",d:"user_menu"},{t:"Cache Redis",d:"đọc nhanh"}],
 points:[
  "RBAC: user ↔ vai trò ↔ quyền. Kiểm tra quyền là xem user có vai trò nào chứa quyền đó.",
  "Tính sẵn quyền cuối cùng của từng user vào một bảng (như user_menu) giúp đọc nhanh, đổi lại mỗi lần đổi vai trò hoặc menu phải tính lại.",
  "Cập nhật DB và xóa cache: xóa SAU khi commit (@TransactionalEventListener AFTER_COMMIT). Xóa trước khi commit thì một request khác có thể đọc dữ liệu cũ và nạp lại vào cache.",
  "Đồng bộ phải chạy lại được nhiều lần mà kết quả không đổi (idempotent), để lỗi giữa chừng chỉ cần chạy lại.",
  "Có cơ chế phát hiện lệch: TTL cho cache như lưới an toàn, hoặc công cụ đồng bộ lại cho một user."
 ],
 pitfalls:["Xóa cache trong transaction rồi transaction rollback: cache và DB lệch.","Đồng bộ toàn bộ user mỗi lần đổi một menu: chậm và dễ lỗi giữa chừng."],
 iv:[{q:"Đồng bộ quyền bị lỗi thì sao?",a:"Em thiết kế đồng bộ idempotent để chạy lại an toàn. Xóa hoặc cập nhật cache sau khi transaction commit để không nạp lại dữ liệu cũ. Có TTL làm lưới an toàn và có cách đồng bộ lại thủ công cho từng tài khoản khi phát hiện lệch."}],
 project:"Chính chị xây phần này: bảng quyền tính sẵn, đồng bộ cache Redis khi gán hoặc gỡ vai trò. Chuẩn bị kể một lần đồng bộ lỗi: triệu chứng, nguyên nhân, cách sửa.",
 rel:["caching","access-refresh","outbox"],
 quiz:[{q:"Nên xóa cache quyền vào lúc nào khi đổi vai trò?",o:["Trước khi cập nhật DB","Trong transaction","Sau khi transaction commit","Không cần xóa"],a:2,w:"Sau commit để không có request nào nạp lại dữ liệu cũ vào cache."}]}
];
LESSONS.push(
/* ================= DATA ================= */
{id:"transactions", r:"data", title:"ACID, isolation và MVCC", min:10,
 problem:"Transaction là một nhóm thao tác hoặc thành công hết, hoặc không có gì thay đổi. Isolation quyết định các transaction chạy song song thấy nhau tới đâu.",
 flow:[{t:"BEGIN",d:""},{t:"Các câu lệnh",d:"đọc theo ảnh chụp"},{t:"COMMIT",d:"ghi WAL, bền vững"},{t:"hoặc ROLLBACK",d:"hủy hết"}],
 points:[
  "ACID: Atomicity (tất cả hoặc không), Consistency (luôn thỏa ràng buộc), Isolation (song song không làm hỏng nhau), Durability (đã commit thì không mất).",
  "Bốn mức isolation: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE. PostgreSQL mặc định READ COMMITTED.",
  "Hiện tượng: dirty read (đọc dữ liệu chưa commit), non-repeatable read (đọc lại một dòng ra giá trị khác), phantom (cùng điều kiện ra thêm dòng), lost update (người sau ghi đè người trước).",
  "MVCC: PostgreSQL không ghi đè mà tạo phiên bản mới của dòng. Người đọc không chặn người ghi. VACUUM dọn phiên bản cũ; transaction mở quá lâu cản việc dọn.",
  "READ COMMITTED không chống lost update. Phải dùng UPDATE có điều kiện, @Version hoặc FOR UPDATE."
 ],
 pitfalls:["Gọi HTTP, gửi message, ký SmartCA bên trong transaction: giữ connection và khóa suốt thời gian chờ.","Tin rằng isolation mặc định tự chống ghi đè."],
 iv:[{q:"Lost update là gì? READ COMMITTED có chống được không?",a:"Hai transaction cùng đọc một giá trị, cùng tính trong code, người ghi sau đè lên người trước. READ COMMITTED không chống được. Dùng UPDATE có điều kiện, optimistic lock @Version, SELECT FOR UPDATE, hoặc REPEATABLE READ kèm thử lại."}],
 project:"Chuyển lớp cập nhật học sinh, phụ huynh, lớp: cả ba phải nằm trong một transaction để không lệch dữ liệu.",
 rel:["propagation","locking","eav"],
 quiz:[{q:"Mức isolation mặc định của PostgreSQL?",o:["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],a:1,w:"READ COMMITTED."},
       {q:"Hai giáo viên cùng sửa điểm, người sau đè người trước. Hiện tượng gì?",o:["Dirty read","Phantom","Lost update","Deadlock"],a:2,w:"Lost update."}]},

{id:"propagation", r:"data", title:"@Transactional, proxy và transaction lồng nhau", min:12,
 problem:"Hàm @Transactional gọi hàm @Transactional khác thì có mấy transaction, ai commit, lỗi ở đâu thì mất gì.",
 flow:[{t:"Controller",d:"gọi bean"},{t:"Proxy (lễ tân)",d:"mở / tham gia transaction"},{t:"Hàm thật",d:"chạy code"},{t:"Proxy",d:"commit hoặc rollback"}],
 points:[
  "Spring bọc bean bằng proxy. @Transactional chỉ có tác dụng khi lời gọi đi qua proxy, tức là được gọi từ bean khác. this.method() đi thẳng vào object thật nên annotation bị bỏ qua. Method private/final/static cũng không được bọc.",
  "REQUIRED (mặc định): có transaction thì dùng chung, chưa có thì mở mới. Cả chuỗi chỉ commit một lần ở hàm ngoài cùng.",
  "REQUIRES_NEW: tạm treo transaction ngoài, mở transaction riêng (connection riêng), commit ngay khi hàm xong. Hợp cho ghi log lỗi.",
  "NESTED: dùng chung nhưng đặt savepoint; hàm con lỗi thì lùi về savepoint. Với JPA có hạn chế vì entity trong bộ nhớ không lùi theo.",
  "Còn lại: SUPPORTS, NOT_SUPPORTED, MANDATORY (bắt buộc có, không thì lỗi), NEVER (bắt buộc không có).",
  "Mặc định chỉ rollback với RuntimeException và Error. Checked exception vẫn commit, trừ khi rollbackFor.",
  "Hàm con REQUIRED ném lỗi, hàm cha bắt và đi tiếp: transaction đã bị đánh dấu rollback-only, lúc commit Spring ném UnexpectedRollbackException."
 ],
 pitfalls:["REQUIRES_NEW đặt trên hàm cùng class: không có tác dụng.","REQUIRES_NEW cập nhật dòng mà transaction ngoài đang khóa: tự deadlock.","Nuốt exception trong hàm @Transactional: dữ liệu sai vẫn được commit."],
 iv:[{q:"Hàm A @Transactional gọi B (bean khác, REQUIRED). B xong, sau đó A lỗi. Dữ liệu của B có còn?",a:"Không. B tham gia transaction của A, chưa commit gì khi B xong. A lỗi thì rollback toàn bộ, mất cả dữ liệu của B. Muốn B được lưu độc lập thì B phải là REQUIRES_NEW và được gọi qua bean khác."},
     {q:"Khi nào gặp UnexpectedRollbackException?",a:"Hàm con dùng chung transaction (REQUIRED) ném lỗi; proxy của nó không được rollback một mình nên đánh dấu rollback-only. Hàm cha bắt lỗi, chạy tiếp, cố commit; Spring thấy dấu đó, rollback hết và ném UnexpectedRollbackException cho người gọi để không ai tưởng đã lưu."}],
 project:"Hình dung \"ống chung, ống riêng\": REQUIRED đổ chung một ống, nổ là bay hết; REQUIRES_NEW có ống riêng, đóng nắp ngay khi xong.",
 rel:["transactions","outbox","filters-interceptors"],
 quiz:[{q:"Trong ServiceA, a() @Transactional gọi this.b() có REQUIRES_NEW. Sau đó a() ném lỗi. b() có được lưu?",o:["Có, vì REQUIRES_NEW","Không, vì this.b() không qua proxy nên b chạy chung transaction của a","Có nếu b không lỗi","Tùy isolation"],a:1,w:"Gọi nội bộ bỏ qua proxy."},
       {q:"b() (bean khác, REQUIRES_NEW) ném lỗi, a() bắt lỗi và chạy tiếp. Kết quả?",o:["Mất hết, UnexpectedRollbackException","Dữ liệu của a còn, của b mất","Cả hai còn","Cả hai mất, không exception"],a:1,w:"Ống riêng của b nổ một mình, ống của a nguyên vẹn."},
       {q:"Hàm @Transactional ném IOException (checked). Mặc định?",o:["Rollback","Commit","Treo","Ném UnexpectedRollbackException"],a:1,w:"Mặc định chỉ rollback RuntimeException và Error."}]},

{id:"locking", r:"data", title:"Khóa, chống ghi đè và deadlock", min:9,
 problem:"Hai người cùng bấm ký một hồ sơ. Synchronized trong Java không đủ khi chạy nhiều pod. Phải chặn ở tầng DB.",
 flow:[{t:"UPDATE có điều kiện",d:"WHERE signed=false"},{t:"Optimistic",d:"@Version"},{t:"Pessimistic",d:"FOR UPDATE"},{t:"Unique constraint",d:"lớp chặn cuối"}],
 points:[
  "UPDATE ... SET signed=true WHERE id=? AND signed=false: kiểm tra và ghi trong một câu, nguyên tử. Số dòng cập nhật bằng 0 nghĩa là người khác đã ký trước.",
  "Optimistic lock (@Version): không khóa, lúc ghi so version, lệch thì ném OptimisticLockException. Hợp khi xung đột hiếm.",
  "Pessimistic lock (SELECT ... FOR UPDATE): khóa dòng ngay khi đọc, người khác chờ. Hợp khi xung đột thường xuyên và transaction ngắn. NOWAIT báo lỗi ngay; SKIP LOCKED bỏ qua dòng đang khóa, dùng cho hàng đợi job.",
  "synchronized chỉ có tác dụng trong một JVM. Nhiều pod thì phải khóa ở DB hoặc khóa phân tán (Redis).",
  "Deadlock: hai transaction giữ khóa chéo và chờ nhau. PostgreSQL phát hiện sau deadlock_timeout (mặc định 1 giây) và hủy một bên (lỗi 40P01). Tránh bằng cách khóa theo cùng thứ tự và giữ transaction ngắn."
 ],
 pitfalls:["Đọc rồi kiểm tra trong Java rồi mới ghi: khoảng hở giữa đọc và ghi là chỗ người khác chen vào.","Khóa trong Java quanh lời gọi DB khi chạy virtual thread trên Java 21: pinning."],
 iv:[{q:"Hai người cùng bấm ký một hồ sơ gần như cùng lúc. Hệ thống xử lý thế nào?",a:"Đây là bài toán lost update. synchronized không đủ vì có nhiều pod. Em dùng UPDATE có điều kiện WHERE signed = false để chỉ một người thành công; người còn lại nhận số dòng cập nhật bằng 0 và được báo 409. Có thể thay bằng @Version hoặc FOR UPDATE tùy mức tranh chấp, và unique constraint làm lớp chặn cuối."}],
 project:"Luồng ký số chặn ký lại và chặn đổi trạng thái \"đã ký\" ngoài luồng ký. Mở code xem hệ thống dùng cách nào ở trên.",
 rel:["transactions","api-practices","threads-vt"],
 quiz:[{q:"Nhiều worker lấy job từ một bảng mà không trùng nhau. Dùng gì?",o:["synchronized","SELECT ... FOR UPDATE SKIP LOCKED","READ UNCOMMITTED","Xóa index"],a:1,w:"Mỗi worker khóa dòng nó lấy, bỏ qua dòng worker khác đang giữ."}]},

{id:"indexing", r:"data", title:"Index và EXPLAIN", min:10,
 problem:"Index giúp đọc nhanh nhưng làm ghi chậm. Chọn index theo câu truy vấn thật và kiểm chứng bằng EXPLAIN ANALYZE.",
 flow:[{t:"Câu SQL chậm",d:"pg_stat_statements"},{t:"EXPLAIN ANALYZE",d:"bước tốn nhất"},{t:"So ước lượng / thật",d:""},{t:"Sửa index / query",d:""},{t:"Đo lại",d:""}],
 points:[
  "B-tree là index mặc định: tìm O(log n), dùng được cho =, <, >, BETWEEN, ORDER BY, LIKE 'abc%'.",
  "Index nhiều cột (a, b, c) theo quy tắc cột bên trái: dùng được cho a, a+b, a+b+c; thường không dùng được khi chỉ lọc b. Cột lọc bằng = đặt trước, cột khoảng hoặc sắp xếp đặt sau.",
  "Kiểu quét: Seq Scan (đọc cả bảng), Index Scan, Bitmap Heap Scan, Index Only Scan (đủ dữ liệu trong index).",
  "Index có mà không được dùng: bọc hàm quanh cột (date(created_at)), khác kiểu, LIKE '%x', sai thứ tự cột, lấy phần lớn số dòng, thống kê cũ.",
  "PostgreSQL không tự tạo index cho khóa ngoại. Tạo index trên production dùng CREATE INDEX CONCURRENTLY."
 ],
 pitfalls:["Index mọi cột.","Thêm index trước khi kiểm tra có phải N+1 không."],
 iv:[{q:"Có index (a, b, c). WHERE b = ? có dùng index không?",a:"Thường không, vì index sắp theo a trước. Dùng được cho a, a + b, a + b + c."}],
 project:"Bảng user_menu nên có unique (user_id, menu_code) để vừa tra nhanh vừa chống trùng.",
 rel:["n-plus-one","eav","locking"],
 quiz:[{q:"WHERE date(created_at) = '2026-11-06' chậm dù có index created_at. Sửa?",o:["Thêm RAM","Viết thành created_at >= '2026-11-06' AND created_at < '2026-11-07'","Bỏ index","Dùng LIKE"],a:1,w:"Không bọc hàm quanh cột để index dùng được."}]},

{id:"n-plus-one", r:"data", title:"N+1 query", min:8,
 problem:"Lấy danh sách tốn 1 câu, rồi mỗi phần tử lại tốn thêm 1 câu cho dữ liệu liên quan. 100 phần tử thành 101 câu.",
 flow:[{t:"1 câu lấy danh sách",d:""},{t:"Lặp từng phần tử",d:"chạm quan hệ LAZY"},{t:"N câu",d:"mỗi lần một round-trip"},{t:"Gộp lại",d:"fetch join, batch, DTO"}],
 points:[
  "Quan hệ LAZY là một proxy; lần đầu chạm vào mới chạy truy vấn.",
  "Đổi sang EAGER không hết N+1 với JPQL, lại làm mọi truy vấn khác nặng hơn.",
  "Cách sửa: JOIN FETCH, @EntityGraph, batch fetch (WHERE id IN (...)), DTO projection.",
  "JOIN FETCH collection cùng phân trang: Hibernate phân trang trong bộ nhớ (cảnh báo HHH000104). Dùng batch fetch hoặc tách hai bước.",
  "Phát hiện: bật log SQL, đếm số câu cho một request; viết test khẳng định số câu."
 ],
 pitfalls:["Ở local DB cùng máy nên không thấy chậm; lên server mỗi câu thêm vài ms qua mạng.","open-in-view che N+1 ở tầng controller."],
 iv:[{q:"N+1 là gì, em gặp chưa?",a:"Định nghĩa như trên, rồi kể DW-2387: danh sách tài liệu chậm vì mỗi file chạy thêm một câu lấy tag. Em gom lại thành một truy vấn và thêm phân trang."}],
 project:"Với EAV, code search lấy mọi giá trị của cả trang trong một câu rồi gom nhóm theo id trong bộ nhớ, chính là cách tránh N+1.",
 rel:["indexing","eav","pools"],
 quiz:[{q:"Đổi quan hệ sang EAGER có hết N+1 không?",o:["Có","Không, với JPQL vẫn N+1 và còn nặng thêm","Chỉ với PostgreSQL","Có nếu dùng Redis"],a:1,w:"EAGER không đổi cách Hibernate nạp sau truy vấn JPQL."}]},

{id:"eav", r:"data", title:"Mô hình EAV: linh động và cái giá", min:10,
 problem:"EAV (Entity–Attribute–Value) cho phép thêm trường mà không đổi schema, nên một lõi phục vụ được nhiều sản phẩm. Cái giá nằm ở truy vấn, ràng buộc và cập nhật nhiều thực thể.",
 flow:[{t:"entity",d:"một bản ghi"},{t:"attribute",d:"định nghĩa trường"},{t:"value",d:"giá trị theo cặp entity–attribute"},{t:"Pivot khi đọc",d:"gom lại thành object"}],
 points:[
  "Ưu điểm: thêm thuộc tính bằng dữ liệu, không cần migration; nhiều sản phẩm (Dowork, Đoàn Luật sư, trường học) chạy chung một source.",
  "Nhược điểm: truy vấn lọc theo nhiều thuộc tính cần nhiều join hoặc pivot; khó tạo ràng buộc kiểu dữ liệu, unique, khóa ngoại ở tầng DB; dễ N+1.",
  "Cập nhật nghiệp vụ chạm nhiều thực thể (chuyển lớp: học sinh, phụ huynh, lớp, nhóm phụ huynh) phải gói trong một transaction, phần gửi message để sau commit.",
  "Thay thế hiện đại: bảng thường + cột jsonb cho phần thuộc tính động, có index GIN hoặc index biểu thức cho key hay lọc.",
  "Khi kể về EAV, nói cả hai mặt: vì sao chọn, và hệ thống đã bù nhược điểm bằng cách nào (truy vấn gộp, cache, kiểm tra ở tầng ứng dụng)."
 ],
 pitfalls:["Lọc nhiều thuộc tính mà mỗi thuộc tính một subquery.","Ràng buộc nghiệp vụ chỉ nằm trong code nên dữ liệu rác lọt qua đường khác."],
 iv:[{q:"EAV có ưu nhược điểm gì? Em xử lý nhược điểm thế nào?",a:"EAV linh động: thêm trường không cần đổi schema, một lõi phục vụ nhiều sản phẩm. Nhược điểm là truy vấn phức tạp, khó ràng buộc ở DB và cập nhật nhiều thực thể phức tạp. Bên em lấy giá trị EAV của cả trang trong một câu rồi gom nhóm trong bộ nhớ, gói các cập nhật liên quan trong một transaction. Nếu thiết kế mới, em cân nhắc bảng thường kèm cột jsonb."}],
 project:"\"Cái giá của sự linh hoạt\" là câu chị dùng trong phần giới thiệu. Chuẩn bị ví dụ chuyển lớp và thu hồi thông báo.",
 rel:["n-plus-one","transactions","rest-design"],
 quiz:[{q:"Điểm mạnh chính của EAV?",o:["Truy vấn nhanh nhất","Thêm thuộc tính không cần đổi schema","Ràng buộc chặt ở DB","Không cần index"],a:1,w:"Linh hoạt về cấu trúc."}]},

/* ================= PERF ================= */
{id:"threads-vt", r:"perf", title:"Platform thread và virtual thread", min:10,
 problem:"Tomcat mặc định 200 thread; request nào chờ I/O cũng giữ một thread. Virtual thread làm việc chờ trở nên rẻ.",
 flow:[{t:"Virtual thread",d:"hàng triệu"},{t:"Mount",d:"lên carrier"},{t:"Gặp I/O",d:"unmount, stack lên heap"},{t:"Carrier",d:"= số nhân CPU"}],
 points:[
  "Platform thread ánh xạ 1:1 với thread hệ điều hành, khoảng 1MB stack giữ chỗ. Virtual thread do JVM quản lý, stack trên heap vài KB.",
  "Virtual thread không làm một request nhanh hơn; nó cho phép nhiều request chờ cùng lúc hơn. Không giúp việc tốn CPU.",
  "Pinning: ở Java 21, I/O bên trong synchronized giữ chặt carrier. Java 24 (JEP 491) sửa phần lớn.",
  "Không pool virtual thread; giới hạn đồng thời bằng Semaphore.",
  "Bật trong Spring Boot 3.2+: spring.threads.virtual.enabled=true. Sau khi bật, nút thắt dời sang connection pool."
 ],
 pitfalls:["Tạo 100.000 platform thread để thử: RAM máy vọt lên hàng chục GB.","Thread.ofVirtual().start rồi join() trong controller: thread Tomcat vẫn đứng chờ."],
 iv:[{q:"Bật virtual thread thì API có nhanh hơn không?",a:"Từng request không nhanh hơn. Virtual thread tăng số request xử lý cùng lúc khi phần lớn thời gian là chờ I/O. Nếu chậm vì CPU hoặc DB thì không giúp gì."}],
 project:"Câu chuyện benchmark: dự án chạy Java 11 nên tự dựng project Java 21, đo bằng wrk, phát hiện nút thắt ở bước xác thực chứ không ở thread.",
 rel:["littles-law","pools","locking"],
 quiz:[{q:"Virtual thread giúp nhiều nhất với loại tải nào?",o:["Tính toán nặng CPU","Chờ I/O nhiều","Xử lý ảnh","Mã hóa"],a:1,w:"Chờ I/O thì unmount, nhả carrier."}]},

{id:"littles-law", r:"perf", title:"Đo đạc: thông lượng, độ trễ và nút thắt", min:10,
 problem:"Benchmark ra 100 request/giây ở cả hai chế độ. Muốn hiểu vì sao, cần công thức đơn giản nối số request đồng thời, độ trễ và thông lượng.",
 flow:[{t:"Đồng thời (L)",d:"số request đang xử lý"},{t:"Độ trễ (W)",d:"thời gian mỗi request"},{t:"Thông lượng (λ)",d:"= L ÷ W"},{t:"Nút thắt",d:"chỗ cho λ nhỏ nhất"}],
 points:[
  "Định luật Little: thông lượng = số request đồng thời ÷ thời gian xử lý mỗi request.",
  "200 thread, mỗi request ngủ 1 giây: tối đa 200 request/giây.",
  "Mỗi tài nguyên có trần riêng: thread ÷ thời gian chiếm thread; số nhân CPU ÷ thời gian CPU mỗi request; số connection DB ÷ thời gian giữ connection. Trần nhỏ nhất là nút thắt.",
  "Thông lượng đứng yên dù tăng concurrency nghĩa là nút thắt không nằm ở chỗ vừa tăng.",
  "Đọc kết quả wrk: Non-2xx phải bằng 0, Socket errors (timeout) phải thấp, latency phải hợp lý với logic. Kết quả nhanh bất thường thường là đang đo lỗi."
 ],
 pitfalls:["Đo với concurrency bằng đúng số thread: không thấy khác biệt.","Chạy app bằng Debug khi đo.","Quên --timeout của wrk (mặc định 2 giây)."],
 iv:[{q:"API chậm khi tải cao, em tìm nút thắt thế nào?",a:"Đo thông lượng và độ trễ khi tăng dần tải. Thông lượng chững lại ở một mức thì tính trần của từng tài nguyên: thread, CPU, connection pool, dịch vụ ngoài, xem cái nào bằng mức đó. Kiểm chứng bằng cách nới riêng tài nguyên nghi ngờ rồi đo lại."}],
 project:"Lab \"Máy tính nút thắt\" mô phỏng đúng lần benchmark của chị.",
 rel:["threads-vt","pools","caching"],
 quiz:[{q:"10 connection DB, mỗi request giữ connection 0,5 giây. Trần thông lượng phía DB?",o:["5 req/s","10 req/s","20 req/s","200 req/s"],a:2,w:"10 ÷ 0,5 = 20."}]},

{id:"pools", r:"perf", title:"Connection pool, thread pool và timeout", min:8,
 problem:"Pool giới hạn tài nguyên đắt. Đặt kích thước và timeout sai thì hoặc lãng phí, hoặc treo dây chuyền.",
 flow:[{t:"Request",d:"cần connection"},{t:"HikariCP",d:"mặc định 10"},{t:"Hết connection",d:"chờ connection-timeout"},{t:"Quá hạn",d:"lỗi"}],
 points:[
  "HikariCP mặc định 10 connection, chờ tối đa 30 giây (connection-timeout).",
  "Tổng connection của mọi pod không được vượt max_connections của PostgreSQL (mặc định 100).",
  "Pool lớn chưa chắc nhanh: DB có giới hạn CPU và đĩa; quá nhiều connection làm DB chậm thêm.",
  "Cách hiệu quả nhất là giảm thời gian giữ connection: transaction ngắn, không gọi dịch vụ ngoài trong transaction.",
  "Mọi lời gọi ra ngoài (HTTP, Feign, SmartCA) phải có connect timeout và read timeout. Không có timeout thì một dịch vụ chậm kéo treo cả thread pool."
 ],
 pitfalls:["Timeout của Feign bị comment trong application.yml.","CompletableFuture.supplyAsync không truyền executor: chạy trên common pool chung cả JVM."],
 iv:[{q:"Bật virtual thread xong, lỗi Connection is not available. Vì sao?",a:"Trước đây 200 thread Tomcat vô tình giới hạn số request chạm DB. Giờ hàng nghìn virtual thread cùng xin connection trong khi pool chỉ có 10, nên chờ quá hạn. Cần giới hạn đồng thời, rút ngắn transaction, rồi mới cân nhắc tăng pool."}],
 project:"MessageReceiver: executor 16–30 thread, Hikari 30, prefetch 10. Hãy tính xem khi tải cao, tài nguyên nào hết trước.",
 rel:["littles-law","resilience","threads-vt"],
 quiz:[{q:"Vì sao không đặt pool 1.000 connection cho chắc?",o:["Hikari không cho","PostgreSQL có max_connections và DB chậm đi khi quá nhiều connection","Tốn RAM client","Không có lý do"],a:1,w:"DB mới là giới hạn thật."}]},

{id:"caching", r:"perf", title:"Cache và bài toán vô hiệu hóa", min:9,
 problem:"Cache làm đọc nhanh, nhưng khó nhất là giữ cache khớp với DB khi dữ liệu đổi.",
 flow:[{t:"Đọc",d:"có trong cache?"},{t:"Miss",d:"đọc DB"},{t:"Ghi cache",d:"kèm TTL"},{t:"Dữ liệu đổi",d:"xóa cache sau commit"}],
 points:[
  "Cache-aside: đọc cache, miss thì đọc DB rồi ghi vào cache. Ghi dữ liệu thì cập nhật DB rồi xóa cache.",
  "Xóa cache SAU khi commit. Xóa trước commit thì request khác có thể đọc DB cũ và nạp lại vào cache.",
  "TTL là lưới an toàn: kể cả quên xóa, cache cũng tự hết hạn.",
  "Cache stampede: key hot hết hạn, hàng nghìn request cùng đọc DB. Giải bằng khóa khi nạp lại hoặc làm mới trước hạn.",
  "Chỉ cache thứ đọc nhiều, ghi ít, chấp nhận lệch ngắn."
 ],
 pitfalls:["Cache trong bộ nhớ từng pod: pod này xóa, pod kia vẫn giữ bản cũ.","Không đặt TTL."],
 iv:[{q:"Vì sao phải xóa cache sau khi commit?",a:"Nếu xóa trước, trong khoảng chưa commit một request khác có thể miss cache, đọc DB vẫn là dữ liệu cũ và ghi lại vào cache. Kết quả là cache giữ dữ liệu cũ dù DB đã đổi."}],
 project:"Cache menu theo tài khoản trong Redis là ví dụ của bài này.",
 rel:["rbac","access-refresh","outbox"],
 quiz:[{q:"Đâu là lưới an toàn khi quên xóa cache?",o:["Index","TTL","Transaction","Semaphore"],a:1,w:"Cache tự hết hạn."}]}
);
LESSONS.push(
/* ================= ASYNC ================= */
{id:"messaging-basics", r:"async", title:"RabbitMQ: exchange, queue, ack, prefetch", min:9,
 problem:"Gửi message thay vì gọi trực tiếp giúp tách service, chịu được lúc bên nhận chậm hoặc chết. Cần hiểu đường đi của một message.",
 flow:[{t:"Producer",d:"publish"},{t:"Exchange",d:"direct, topic, fanout"},{t:"Binding",d:"routing key"},{t:"Queue",d:"lưu message"},{t:"Consumer",d:"xử lý rồi ack"}],
 points:[
  "Producer gửi vào exchange, không gửi thẳng vào queue. Exchange định tuyến tới queue theo binding: direct (khớp key), topic (khớp mẫu), fanout (gửi mọi queue).",
  "Consumer nhận message, xử lý xong thì ack. Chưa ack mà consumer chết, RabbitMQ giao lại message cho consumer khác.",
  "Prefetch: số message tối đa một consumer giữ mà chưa ack. Lớn thì nhanh nhưng dồn việc vào một chỗ; nhỏ thì phân phối đều hơn.",
  "Queue bền (durable) + message persistent để không mất khi broker khởi động lại.",
  "Ack ở thời điểm nào là quyết định quan trọng: ack sau khi xử lý xong mới đảm bảo không mất message."
 ],
 pitfalls:["Ack ngay khi nhận rồi chuyển việc sang thread pool: xử lý lỗi thì message đã mất.","Prefetch quá lớn với việc xử lý chậm."],
 iv:[{q:"Pod consumer chết khi đang xử lý message thì sao?",a:"Message chưa được ack nên RabbitMQ giữ lại và giao cho consumer khác. Vì vậy một message có thể được xử lý hơn một lần, consumer phải idempotent."}],
 project:"Kết quả H5P đi qua RabbitMQ. Kiểm tra MessageReceiver: ack lúc nào, trước hay sau khi messageProcessingExecutor xử lý xong.",
 rel:["consumer-failures","delivery-idempotency","outbox"],
 quiz:[{q:"Producer gửi message tới đâu trong RabbitMQ?",o:["Thẳng vào consumer","Exchange","Database","Queue luôn luôn trực tiếp"],a:1,w:"Exchange định tuyến tới queue."}]},

{id:"consumer-failures", r:"async", title:"Consumer xử lý lỗi thì sao", min:10,
 problem:"Câu bị hỏi: message tới consumer mà xử lý bị lỗi thì backend xử lý thế nào. Đây là trường hợp consumer vẫn sống, khác với pod chết.",
 flow:[{t:"Nhận message",d:""},{t:"Lỗi",d:"exception"},{t:"Retry có giãn cách",d:"1s, 2s, 4s"},{t:"Vẫn lỗi",d:"đẩy sang DLQ"},{t:"Cảnh báo",d:"xử lý lại sau"}],
 points:[
  "Mặc định Spring AMQP requeue khi listener ném exception. Message hỏng (poison message) bị giao lại liên tục thành vòng lặp vô hạn.",
  "Retry có giới hạn và giãn cách cho lỗi tạm thời (DB chậm, mạng chập chờn): spring.rabbitmq.listener.simple.retry.enabled=true, max-attempts, initial-interval, multiplier.",
  "Khi bật retry, hết số lần thử Spring mặc định từ chối message không requeue. Nếu queue có cấu hình dead letter exchange thì message sang DLQ; nếu không có thì message bị bỏ.",
  "Lỗi chắc chắn không sửa được bằng retry (dữ liệu sai định dạng): ném AmqpRejectAndDontRequeueException để vào thẳng DLQ.",
  "Giám sát DLQ: cảnh báo khi có message, sửa lỗi xong thì đẩy lại về queue chính."
 ],
 pitfalls:["Bật retry mà không cấu hình DLQ: message lỗi biến mất.","Retry không giãn cách: dồn tải thêm vào hệ thống đang yếu."],
 iv:[{q:"Message tới consumer bị lỗi thì backend xử lý thế nào?",a:"Có hai trường hợp. Pod chết thì message chưa ack được giao cho consumer khác. Consumer sống mà xử lý lỗi thì mặc định Spring requeue và có thể lặp vô hạn. Em cấu hình retry có giới hạn và giãn cách cho lỗi tạm thời, hết lần thì đẩy vào dead letter queue để không chặn hàng đợi, lỗi dữ liệu thì vào thẳng DLQ. Có cảnh báo trên DLQ để xử lý lại. Vì message có thể giao nhiều lần nên consumer phải idempotent."}],
 project:"Lab \"Consumer gặp lỗi\" cho chị thử bật tắt retry, DLQ, idempotency và xem chuyện gì xảy ra với message.",
 rel:["messaging-basics","delivery-idempotency","resilience"],
 quiz:[{q:"Bật retry 3 lần nhưng không có DLQ. Hết 3 lần message đi đâu?",o:["Requeue mãi","Bị bỏ","Lưu vào DB","Gửi email"],a:1,w:"Recoverer mặc định từ chối không requeue; không có dead letter thì message bị bỏ."},
       {q:"Lỗi dữ liệu sai định dạng, retry vô ích. Nên làm gì?",o:["Requeue","Ném AmqpRejectAndDontRequeueException để vào DLQ","Nuốt lỗi","Tăng prefetch"],a:1,w:"Không phí lượt thử cho lỗi vĩnh viễn."}]},

{id:"delivery-idempotency", r:"async", title:"Giao ít nhất một lần và idempotency", min:8,
 problem:"RabbitMQ đảm bảo giao ít nhất một lần. Cùng một message có thể tới hai lần, nên xử lý hai lần phải ra cùng kết quả.",
 flow:[{t:"Message có id",d:""},{t:"Đã xử lý id này?",d:"bảng processed / unique"},{t:"Rồi",d:"bỏ qua, ack"},{t:"Chưa",d:"xử lý + ghi id cùng transaction"}],
 points:[
  "At-most-once: có thể mất. At-least-once: có thể trùng. Exactly-once giữa các hệ thống tách rời gần như không có; thực tế là at-least-once + idempotent.",
  "Cách 1: lưu id message đã xử lý (unique), ghi cùng transaction với dữ liệu nghiệp vụ.",
  "Cách 2: thiết kế thao tác tự idempotent: tính lại từ dữ liệu gốc (SET progress = ...) thay vì cộng dồn (progress = progress + 1).",
  "Cách 3: UPDATE có điều kiện theo trạng thái (WHERE status = 'PENDING')."
 ],
 pitfalls:["progress = progress + x với message có thể giao lại: tiến độ vượt 100%.","Kiểm tra trùng rồi mới ghi ở hai transaction khác nhau."],
 iv:[{q:"Hai kết quả bài H5P giống hệt nhau tới hai lần. Tiến độ có sai không?",a:"Nếu cộng dồn thì có. Em tính lại tiến độ từ dữ liệu gốc bằng một câu UPDATE, vừa nguyên tử vừa idempotent, hoặc lưu id message đã xử lý với unique constraint."}],
 project:"Backend H5P nhận kết quả qua RabbitMQ và tính tiến độ bài học, khóa học. Kiểm tra code đang cộng dồn hay tính lại.",
 rel:["consumer-failures","locking","api-practices"],
 quiz:[{q:"Cách tính tiến độ nào an toàn khi message bị giao lại?",o:["progress = progress + 10","Tính lại từ bảng kết quả gốc","Bỏ qua message thứ hai ngẫu nhiên","Tăng prefetch"],a:1,w:"Tính lại cho cùng kết quả dù chạy bao nhiêu lần."}]},

{id:"outbox", r:"async", title:"Ghi DB và gửi message: bài toán ghi kép", min:9,
 problem:"Lưu dữ liệu rồi gửi message. Transaction rollback nhưng message đã đi, hoặc commit xong mà gửi message thất bại. Hai hệ thống lệch nhau.",
 flow:[{t:"Transaction",d:"ghi dữ liệu + ghi outbox"},{t:"Commit",d:"cùng lúc"},{t:"Relay",d:"đọc outbox"},{t:"Publish",d:"RabbitMQ"},{t:"Đánh dấu đã gửi",d:""}],
 points:[
  "Gửi message bên trong transaction: transaction rollback thì bên nhận vẫn xử lý dữ liệu không tồn tại.",
